<script>
(() => {
  const stage = () => Number(document.getElementById(&quot;deck&quot;).dataset.stage);
  const send = (type) => parent.deckNav(window, type);
  const forward = [&quot;ArrowRight&quot;, &quot;ArrowDown&quot;, &quot; &quot;, &quot;PageDown&quot;, &quot;Enter&quot;];
  const back = [&quot;ArrowLeft&quot;, &quot;ArrowUp&quot;, &quot;PageUp&quot;, &quot;Backspace&quot;];
  addEventListener(&quot;keydown&quot;, (event) => {
    if (forward.includes(event.key) &amp;&amp; stage() === stages.length) send(&quot;next&quot;);
    else if (back.includes(event.key) &amp;&amp; stage() === 1) send(&quot;prev&quot;);
    else return;
    event.preventDefault();
    event.stopImmediatePropagation();
  });
  addEventListener(&quot;click&quot;, (event) => {
    if (event.target.closest?.(&quot;a&quot;)) return;
    if (!event.shiftKey &amp;&amp; stage() === stages.length) send(&quot;next&quot;);
    else if (event.shiftKey &amp;&amp; stage() === 1) send(&quot;prev&quot;);
    else return;
    event.stopImmediatePropagation();
  });
  addEventListener(&quot;DOMContentLoaded&quot;, () => {
    const deck = document.getElementById(&quot;deck&quot;);
    new MutationObserver(() => send(&quot;stage&quot;)).observe(deck, { attributes: true, attributeFilter: [&quot;data-stage&quot;] });
  });
})();
</script>

      <!-- 4: billing arrangements and why cost matters -->
      <div class=&quot;abs&quot; data-on=&quot;4&quot; style=&quot;inset: 0&quot;>
        <article class=&quot;billing-card metered&quot;>
          <div class=&quot;eyebrow&quot;>METERED API</div>
          <h2>Pay per token</h2>
          <p>Every input, cache and output token is billed at the provider's price.</p>
          <div class=&quot;why&quot;><span>Why cost matters</span>Fewer, cheaper tokens per task mean a smaller invoice at the end of the month.</div>
        </article>
        <article class=&quot;billing-card subscription&quot;>
          <div class=&quot;eyebrow&quot;>SUBSCRIPTION</div>
          <h2>Fixed fee with usage limits</h2>
          <p>A monthly seat with included usage and limits that reset.</p>
          <div class=&quot;why&quot;><span>Why cost matters</span>A cheaper task uses less of the limit, so you get more work done before you are throttled or need a higher tier.</div>
        </article>
        <article class=&quot;billing-card hybrid&quot;>
          <div class=&quot;eyebrow&quot;>HYBRID</div>
          <h2>Included usage, then pay for more</h2>
          <p>A subscription or commitment, plus credits or overage once it runs out.</p>
          <div class=&quot;why&quot;><span>Why cost matters</span>The included usage lasts longer, and less spills over into paid overage.</div>
        </article>
        <div class=&quot;definition if-def&quot;><b>The lever is the same on every plan:</b> fewer and cheaper tokens for each finished task.</div>
      </div>

      <!-- 5: model and agent -->
      <div class=&quot;abs&quot; data-on=&quot;5&quot; style=&quot;inset: 0&quot;>
        <article class=&quot;actor model&quot;>
          <div class=&quot;eyebrow&quot;>LLM</div>
          <h2>The stateless expert</h2>
          <div class=&quot;tagline&quot;>Reads one supplied context and produces one response.</div>
          <ul>
            <li>Understands text, code, images, and structured tool requests</li>
            <li>Reasons over only what is present in this model call</li>
            <li>Has no conversation memory between calls</li>
          </ul>
        </article>
        <article class=&quot;actor agent&quot; style=&quot;--d: 160ms&quot;>
          <div class=&quot;eyebrow&quot; style=&quot;color: var(--blue)&quot;>Agent</div>
          <h2>The software around it</h2>
          <div class=&quot;tagline&quot;>Maintains the task and orchestrates the loop.</div>
          <ul>
            <li>Maintains task state and conversation history</li>
            <li>Assembles context and calls the model</li>
            <li>Executes tools and attaches their results</li>
            <li>Continues the loop or returns control to the user</li>
          </ul>
        </article>
        <div class=&quot;actor-note&quot;>The model knows only what the agent sends in the current call.</div>
      </div>

    const stages = [
      {
        title: &quot;Get More from Your AI Coding Budget&quot;,
        line: &quot;A hands-on cost optimization workshop for AI coding agents.&quot;
      },
      {
        title: &quot;Workshop leads&quot;,
        line: &quot;We build Felan, a platform for background coding agents for software engineering teams.&quot;
      },
      {
        title: &quot;From prompt to invoice&quot;,
        line: &quot;How one coding task becomes model calls, growing context, token usage, and eventually a usage record.&quot;
      },
      {
        title: &quot;Why cost matters on every plan&quot;,
        line: &quot;There are three common ways to pay for AI coding. On each of them, a more efficient workflow buys you something.&quot;
      },
      {
        title: &quot;The model and the agent are different things&quot;,
        line: &quot;The model is a stateless expert. The agent is the software that maintains the task, builds requests, and executes tools.&quot;
      },
      {
        title: &quot;The agent loop&quot;,
        line: &quot;Even a simple task takes a loop: model calls and tool executions alternate until the model has enough evidence to finish the turn.&quot;
      },
      {
        title: &quot;The prompt cache&quot;,
        line: &quot;Every call resends the whole context. When it starts with exactly the same tokens as before, the provider can reuse that work.&quot;
      },
      {
        title: &quot;What breaks the cache&quot;,
        line: &quot;A cache read needs the same model and an exact prefix match. Any change resets reuse from that point on.&quot;
      },
      {
        title: &quot;What each token type costs&quot;,
        line: &quot;The same number of tokens can cost very different amounts. Output is the most expensive per token; cache reads are the cheapest.&quot;
      },
      {
        title: &quot;Now inspect a real task&quot;,
        line: &quot;Run the baseline task, then read its report with the questions from this session.&quot;
      }
    ];

  <script>
    (() => {
      const deck = document.getElementById(&quot;deck&quot;);
      const head = deck.querySelector(&quot;.head&quot;);
      const title = document.getElementById(&quot;title&quot;);
      const line = document.getElementById(&quot;line&quot;);
      const progress = deck.querySelector(&quot;.progress&quot;);
      stages.forEach(() => progress.appendChild(document.createElement(&quot;i&quot;)));
      const bars = Array.from(progress.children);

      const matcher = (spec) => {
        const parts = spec.split(&quot;,&quot;).map((part) => part.trim());
        return (n) => parts.some((part) => {
          if (!part.includes(&quot;-&quot;)) return n === Number(part);
          const [from, to] = part.split(&quot;-&quot;);
          return n >= Number(from) &amp;&amp; (to === &quot;&quot; || n <= Number(to));
        });
      };
      const shown = Array.from(deck.querySelectorAll(&quot;[data-on]&quot;)).map((el) => ({ el, test: matcher(el.dataset.on) }));

      let current = 0;
      let revealStep = 0;
      const revealCounts = new Map([[6, 11], [7, 2], [8, 3]]);
      let swapTimer;

      const revealContent = () => {
        const stage = String(current + 1);
        deck.querySelectorAll(&quot;.reveal-item&quot;).forEach((el) => {
          const scene = el.closest(&quot;[data-on]&quot;);
          const visible = scene?.dataset.on === stage &amp;&amp; Number(el.dataset.step) <= revealStep;
          el.classList.toggle(&quot;is-revealed&quot;, visible);
        });
        deck.querySelectorAll(&quot;.variant-a&quot;).forEach((scene) => {
          const active = scene.dataset.on === String(current + 1);
          let any = false;
          scene.querySelectorAll(&quot;.overlay-step&quot;).forEach((overlay) => {
            const on = active &amp;&amp; Number(overlay.dataset.overlay) === revealStep;
            overlay.classList.toggle(&quot;is-on&quot;, on);
            any ||= on;
          });
          scene.classList.toggle(&quot;overlay-on&quot;, any);
          scene.classList.toggle(&quot;loop-wide&quot;, active &amp;&amp; revealStep < 4);
        });
      };

      const setText = () => {
        title.textContent = stages[current].title;
        line.textContent = stages[current].line;
        document.title = stages[current].title;
      };

      const go = (index, syncHash = true) => {
        current = Math.max(0, Math.min(stages.length - 1, index));
        revealStep = 0;
        const n = current + 1;
        deck.dataset.stage = String(n);
        clearTimeout(swapTimer);
        if (deck.dataset.ready === &quot;true&quot;) {
          head.classList.add(&quot;fade&quot;);
          swapTimer = setTimeout(() => { setText(); head.classList.remove(&quot;fade&quot;); }, 180);
        } else {
          setText();
        }
        shown.forEach(({ el, test }) => el.classList.toggle(&quot;on&quot;, test(n)));
        revealContent();
        bars.forEach((bar, i) => bar.classList.toggle(&quot;on&quot;, i <= current));
        if (syncHash) try { history.replaceState(null, &quot;&quot;, `#${n}`); } catch {}
      };

      const fromHash = () => {
        const n = Number(location.hash.slice(1));
        return Number.isInteger(n) &amp;&amp; n >= 1 &amp;&amp; n <= stages.length ? n - 1 : 0;
      };

      const scale = () => {
        const s = Math.min(innerWidth / 1920, innerHeight / 1080);
        deck.style.transform = `translate(-50%, -50%) scale(${s})`;
      };

      addEventListener(&quot;resize&quot;, scale);
      addEventListener(&quot;hashchange&quot;, () => go(fromHash(), false));
      addEventListener(&quot;click&quot;, (event) => {
        if (event.target.closest?.(&quot;a&quot;)) return;
        if (event.shiftKey) {
          go(current - 1);
          return;
        }
        const revealCount = revealCounts.get(current + 1) ?? 0;
        if (revealStep < revealCount) {
          revealStep += 1;
          revealContent();
          return;
        }
        go(current + 1);
      });
      addEventListener(&quot;keydown&quot;, (event) => {
        if (event.key === &quot;ArrowRight&quot;) {
          if (revealStep < (revealCounts.get(current + 1) ?? 0)) {
            revealStep += 1;
            revealContent();
          } else {
            go(current + 1);
          }
        } else if (event.key === &quot;ArrowLeft&quot;) {
          if (revealStep > 0) {
            revealStep -= 1;
            revealContent();
          } else {
            go(current - 1);
          }
        } else if ([&quot;ArrowDown&quot;, &quot; &quot;, &quot;PageDown&quot;, &quot;Enter&quot;].includes(event.key)) go(current + 1);
        else if ([&quot;ArrowUp&quot;, &quot;PageUp&quot;, &quot;Backspace&quot;].includes(event.key)) go(current - 1);
        else if (event.key === &quot;Home&quot;) go(0);
        else if (event.key === &quot;End&quot;) go(stages.length - 1);
        else return;
        event.preventDefault();
      });

      scale();
      go(fromHash(), false);
      requestAnimationFrame(() => requestAnimationFrame(() => { deck.dataset.ready = &quot;true&quot;; }));
    })();
  </script>

<script>
(() => {
  const stage = () => Number(document.getElementById(&quot;deck&quot;).dataset.stage);
  const send = (type) => parent.deckNav(window, type);
  const forward = [&quot;ArrowRight&quot;, &quot;ArrowDown&quot;, &quot; &quot;, &quot;PageDown&quot;, &quot;Enter&quot;];
  const back = [&quot;ArrowLeft&quot;, &quot;ArrowUp&quot;, &quot;PageUp&quot;, &quot;Backspace&quot;];
  addEventListener(&quot;keydown&quot;, (event) => {
    if (forward.includes(event.key) &amp;&amp; stage() === stages.length) send(&quot;next&quot;);
    else if (back.includes(event.key) &amp;&amp; stage() === 1) send(&quot;prev&quot;);
    else return;
    event.preventDefault();
    event.stopImmediatePropagation();
  });
  addEventListener(&quot;click&quot;, (event) => {
    if (event.target.closest?.(&quot;a&quot;)) return;
    if (!event.shiftKey &amp;&amp; stage() === stages.length) send(&quot;next&quot;);
    else if (event.shiftKey &amp;&amp; stage() === 1) send(&quot;prev&quot;);
    else return;
    event.stopImmediatePropagation();
  });
  addEventListener(&quot;DOMContentLoaded&quot;, () => {
    const deck = document.getElementById(&quot;deck&quot;);
    new MutationObserver(() => send(&quot;stage&quot;)).observe(deck, { attributes: true, attributeFilter: [&quot;data-stage&quot;] });
  });
})();

  <script>
    const stages = [
      {
        title: &quot;Prewalk&quot;,
        line: &quot;One session, two models. A frontier model works until the first edit, then a cheaper model takes over. From Can Bölük's July 2026 post at Stencil.&quot;,
        link: { text: &quot;Can Bölük's July 2026 post at Stencil&quot;, href: &quot;https://stencil.so/blog/prewalk&quot; }
      },
      {
        title: &quot;You pay for reading, not writing&quot;,
        line: &quot;Every request sends the whole conversation again. The cache makes rereading cheaper, not free, and it is still most of the bill.&quot;
      },
      {
        title: &quot;One model, one long trajectory&quot;,
        line: &quot;The decisions come in the first turns. The doing comes after the first edit, when the context is biggest. One frontier model pays frontier prices for both.&quot;
      },
      {
        title: &quot;The obvious fix: plan big, execute small&quot;,
        line: &quot;The cheaper model only gets the plan, so the plan has to be complete enough for a correct solution. That takes more planning, at frontier prices. Stencil's test: the quality held and the cost went up.&quot;
      },
      {
        title: &quot;Step 1: plan as a todo list&quot;,
        line: &quot;A hidden instruction asks the model to plan, then write a short todo list with a check for each item. Without the list, small models declared the task done too early.&quot;
      },
      {
        title: &quot;Step 2: wait for the first edit&quot;,
        line: &quot;The switch waits for the first successful edit. By then the model has picked an approach, and the approach worked in the real code.&quot;
      },
      {
        title: &quot;Step 3: switch models, drop the instruction&quot;,
        line: &quot;The cheaper model continues the same session. The planning instruction is removed, so as far as it can tell, it planned the work itself.&quot;
      },
      {
        title: &quot;What the cheaper model inherits&quot;,
        line: &quot;Prewalk hands over the whole session, not a summary of it. The switch costs one request that processes the context again, at the cheaper model's price.&quot;
      },
      {
        title: &quot;Why switch at the first edit&quot;,
        line: &quot;A fixed turn is too late for easy tasks and too early for hard ones. The first edit also ends the frontier phase early, at a median of about 7 turns in Stencil's runs.&quot;
      },
      {
        title: &quot;Most of the quality at about half the cost&quot;,
        line: &quot;On SWE-Bench Pro, Prewalk kept 92 to 97% of the frontier pass rate at 53 to 61% of its cost. The plan handoff kept the quality and cost more than Opus alone.&quot;
      },
      {
        title: &quot;Where the saving comes from&quot;,
        line: &quot;Quality follows who makes the decisions. Cost follows how long the frontier model keeps reading before a cheaper model takes over.&quot;
      },
      {
        title: &quot;The price: an independent review&quot;,
        line: &quot;Prewalk alone loses a few points, and the goal is a feature that works. A strong reviewer that did not write the code checks the change. It costs extra, and the cheaper model fixes what it finds.&quot;
      },
      {
        title: &quot;Prewalk by hand&quot;,
        line: &quot;Any agent can do it with three prompts and one model switch. We try it on a small checkout bug.&quot;
      }
    ];
  </script>
  <script>
    (() => {
      const deck = document.getElementById(&quot;deck&quot;);
      const head = deck.querySelector(&quot;.head&quot;);
      const title = document.getElementById(&quot;title&quot;);
      const line = document.getElementById(&quot;line&quot;);
      const progress = deck.querySelector(&quot;.progress&quot;);
      stages.forEach(() => progress.appendChild(document.createElement(&quot;i&quot;)));
      const bars = Array.from(progress.children);

      const matcher = (spec) => {
        const parts = spec.split(&quot;,&quot;).map((part) => part.trim());
        return (n) => parts.some((part) => {
          if (!part.includes(&quot;-&quot;)) return n === Number(part);
          const [from, to] = part.split(&quot;-&quot;);
          return n >= Number(from) &amp;&amp; (to === &quot;&quot; || n <= Number(to));
        });
      };
      const shown = Array.from(deck.querySelectorAll(&quot;[data-on]&quot;)).map((el) => ({ el, test: matcher(el.dataset.on) }));

      let current = 0;
      let swapTimer;

      const setText = () => {
        title.textContent = stages[current].title;
        const { line: text, link } = stages[current];
        const at = link ? text.indexOf(link.text) : -1;
        if (at < 0) {
          line.textContent = text;
        } else {
          const a = document.createElement(&quot;a&quot;);
          a.href = link.href;
          a.target = &quot;_blank&quot;;
          a.rel = &quot;noopener&quot;;
          a.textContent = link.text;
          line.replaceChildren(text.slice(0, at), a, text.slice(at + link.text.length));
        }
        document.title = stages[current].title;
      };

      const go = (index, syncHash = true) => {
        current = Math.max(0, Math.min(stages.length - 1, index));
        const n = current + 1;
        deck.dataset.stage = String(n);
        clearTimeout(swapTimer);
        if (deck.dataset.ready === &quot;true&quot;) {
          head.classList.add(&quot;fade&quot;);
          swapTimer = setTimeout(() => { setText(); head.classList.remove(&quot;fade&quot;); }, 180);
        } else {
          setText();
        }
        shown.forEach(({ el, test }) => el.classList.toggle(&quot;on&quot;, test(n)));
        bars.forEach((bar, i) => bar.classList.toggle(&quot;on&quot;, i <= current));
        if (syncHash) try { history.replaceState(null, &quot;&quot;, `#${n}`); } catch {}
      };

      const fromHash = () => {
        const n = Number(location.hash.slice(1));
        return Number.isInteger(n) &amp;&amp; n >= 1 &amp;&amp; n <= stages.length ? n - 1 : 0;
      };

      const scale = () => {
        const s = Math.min(innerWidth / 1920, innerHeight / 1080);
        deck.style.transform = `translate(-50%, -50%) scale(${s})`;
      };

      addEventListener(&quot;resize&quot;, scale);
      addEventListener(&quot;hashchange&quot;, () => go(fromHash(), false));
      addEventListener(&quot;click&quot;, (event) => {
        if (event.target.closest(&quot;a&quot;)) return;
        go(current + (event.shiftKey ? -1 : 1));
      });
      addEventListener(&quot;keydown&quot;, (event) => {
        const forward = [&quot;ArrowRight&quot;, &quot;ArrowDown&quot;, &quot; &quot;, &quot;PageDown&quot;, &quot;Enter&quot;];
        const back = [&quot;ArrowLeft&quot;, &quot;ArrowUp&quot;, &quot;PageUp&quot;, &quot;Backspace&quot;];
        if (forward.includes(event.key)) go(current + 1);
        else if (back.includes(event.key)) go(current - 1);
        else if (event.key === &quot;Home&quot;) go(0);
        else if (event.key === &quot;End&quot;) go(stages.length - 1);
        else return;
        event.preventDefault();
      });

      scale();
      go(fromHash(), false);
      requestAnimationFrame(() => requestAnimationFrame(() => { deck.dataset.ready = &quot;true&quot;; }));
    })();

  <script>
    const stages = [
      {
        title: &quot;Output compaction&quot;,
        line: &quot;Cutting what tools return before the model reads it.&quot;
      },
      {
        title: &quot;How a tool call works&quot;,
        line: &quot;The model only writes the request. The agent runs the tool and sends the result back as part of the next request.&quot;
      },
      {
        title: &quot;Output is everything the command prints&quot;,
        line: &quot;Standard output and errors become input tokens. This is the real pnpm test output from the workshop repository.&quot;
      },
      {
        title: &quot;It is sent again with every later request&quot;,
        line: &quot;The output stays in the context. Every later request pays for it again until compaction removes it.&quot;
      },
      {
        title: &quot;Three places to cut it&quot;,
        line: &quot;Before the command runs, after the result comes back, or on the way to the provider.&quot;
      },
      {
        title: &quot;What compaction does to output&quot;,
        line: &quot;The same few techniques show up in every tool.&quot;
      },
      {
        title: &quot;RTK&quot;,
        line: &quot;A hook rewrites shell commands to run through RTK, which runs the real command and filters its output. Built-in Read and Grep tools bypass it.&quot;
      },
      {
        title: &quot;ctx-wire&quot;,
        line: &quot;It sits where RTK sits. You can write filters as TOML, secrets are scrubbed before the model sees them, and the full log stays on disk.&quot;
      },
      {
        title: &quot;Headroom&quot;,
        line: &quot;A local proxy between the agent and the provider. It compresses the whole request by content type, and the model can fetch any original back.&quot;
      },
      {
        title: &quot;Felan Code: RTK plus its own compaction&quot;,
        line: &quot;Felan Code runs RTK when it is installed, then compacts bash and grep results itself, with or without RTK.&quot;
      },
      {
        title: &quot;Cut too much and you pay twice&quot;,
        line: &quot;This happened while preparing this workshop. When the agent needs what was cut, it reads it again.&quot;
      },
      {
        title: &quot;See what RTK removes&quot;,
        line: &quot;Compare the two outputs yourself, then turn RTK on and let the agent run the same command without asking for it.&quot;
      }
    ];

  <script>
    (() => {
      const deck = document.getElementById(&quot;deck&quot;);
      const head = deck.querySelector(&quot;.head&quot;);
      const title = document.getElementById(&quot;title&quot;);
      const line = document.getElementById(&quot;line&quot;);
      const progress = deck.querySelector(&quot;.progress&quot;);
      stages.forEach(() => progress.appendChild(document.createElement(&quot;i&quot;)));
      const bars = Array.from(progress.children);

      const matcher = (spec) => {
        const parts = spec.split(&quot;,&quot;).map((part) => part.trim());
        return (n) => parts.some((part) => {
          if (!part.includes(&quot;-&quot;)) return n === Number(part);
          const [from, to] = part.split(&quot;-&quot;);
          return n >= Number(from) &amp;&amp; (to === &quot;&quot; || n <= Number(to));
        });
      };
      const shown = Array.from(deck.querySelectorAll(&quot;[data-on]&quot;)).map((el) => ({ el, test: matcher(el.dataset.on) }));

      let current = 0;
      let swapTimer;

      const setText = () => {
        title.textContent = stages[current].title;
        line.textContent = stages[current].line;
        document.title = stages[current].title;
      };

      const go = (index, syncHash = true) => {
        current = Math.max(0, Math.min(stages.length - 1, index));
        const n = current + 1;
        deck.dataset.stage = String(n);
        clearTimeout(swapTimer);
        if (deck.dataset.ready === &quot;true&quot;) {
          head.classList.add(&quot;fade&quot;);
          swapTimer = setTimeout(() => { setText(); head.classList.remove(&quot;fade&quot;); }, 180);
        } else {
          setText();
        }
        shown.forEach(({ el, test }) => el.classList.toggle(&quot;on&quot;, test(n)));
        bars.forEach((bar, i) => bar.classList.toggle(&quot;on&quot;, i <= current));
        if (syncHash) try { history.replaceState(null, &quot;&quot;, `#${n}`); } catch {}
      };

      const fromHash = () => {
        const n = Number(location.hash.slice(1));
        return Number.isInteger(n) &amp;&amp; n >= 1 &amp;&amp; n <= stages.length ? n - 1 : 0;
      };

      const scale = () => {
        const s = Math.min(innerWidth / 1920, innerHeight / 1080);
        deck.style.transform = `translate(-50%, -50%) scale(${s})`;
      };

      addEventListener(&quot;resize&quot;, scale);
      addEventListener(&quot;hashchange&quot;, () => go(fromHash(), false));

  <script>
    (() => {
      const deck = document.getElementById(&quot;deck&quot;);
      const head = deck.querySelector(&quot;.head&quot;);
      const title = document.getElementById(&quot;title&quot;);
      const line = document.getElementById(&quot;line&quot;);
      const progress = deck.querySelector(&quot;.progress&quot;);
      stages.forEach(() => progress.appendChild(document.createElement(&quot;i&quot;)));
      const bars = Array.from(progress.children);

      const matcher = (spec) => {
        const parts = spec.split(&quot;,&quot;).map((part) => part.trim());
        return (n) => parts.some((part) => {
          if (!part.includes(&quot;-&quot;)) return n === Number(part);
          const [from, to] = part.split(&quot;-&quot;);
          return n >= Number(from) &amp;&amp; (to === &quot;&quot; || n <= Number(to));
        });
      };
      const shown = Array.from(deck.querySelectorAll(&quot;[data-on]&quot;)).map((el) => ({ el, test: matcher(el.dataset.on) }));

      let current = 0;
      let swapTimer;

      const setText = () => {
        title.textContent = stages[current].title;
        line.textContent = stages[current].line;
        document.title = stages[current].title;
      };

      const go = (index, syncHash = true) => {
        current = Math.max(0, Math.min(stages.length - 1, index));
        const n = current + 1;
        deck.dataset.stage = String(n);
        clearTimeout(swapTimer);
        if (deck.dataset.ready === &quot;true&quot;) {
          head.classList.add(&quot;fade&quot;);
          swapTimer = setTimeout(() => { setText(); head.classList.remove(&quot;fade&quot;); }, 180);
        } else {
          setText();
        }
        shown.forEach(({ el, test }) => el.classList.toggle(&quot;on&quot;, test(n)));
        bars.forEach((bar, i) => bar.classList.toggle(&quot;on&quot;, i <= current));
        if (syncHash) try { history.replaceState(null, &quot;&quot;, `#${n}`); } catch {}
      };

      const fromHash = () => {
        const n = Number(location.hash.slice(1));
        return Number.isInteger(n) &amp;&amp; n >= 1 &amp;&amp; n <= stages.length ? n - 1 : 0;
      };

      const scale = () => {
        const s = Math.min(innerWidth / 1920, innerHeight / 1080);
        deck.style.transform = `translate(-50%, -50%) scale(${s})`;
      };

      addEventListener(&quot;resize&quot;, scale);
      addEventListener(&quot;hashchange&quot;, () => go(fromHash(), false));
      addEventListener(&quot;click&quot;, (event) => go(current + (event.shiftKey ? -1 : 1)));
      addEventListener(&quot;keydown&quot;, (event) => {
        const forward = [&quot;ArrowRight&quot;, &quot;ArrowDown&quot;, &quot; &quot;, &quot;PageDown&quot;, &quot;Enter&quot;];
        const back = [&quot;ArrowLeft&quot;, &quot;ArrowUp&quot;, &quot;PageUp&quot;, &quot;Backspace&quot;];
        if (forward.includes(event.key)) go(current + 1);
        else if (back.includes(event.key)) go(current - 1);
        else if (event.key === &quot;Home&quot;) go(0);
        else if (event.key === &quot;End&quot;) go(stages.length - 1);
        else return;
        event.preventDefault();
      });

      scale();
      go(fromHash(), false);
      requestAnimationFrame(() => requestAnimationFrame(() => { deck.dataset.ready = &quot;true&quot;; }));
    })();

(() => {

  const forward = [&quot;ArrowRight&quot;, &quot;ArrowDown&quot;, &quot; &quot;, &quot;PageDown&quot;, &quot;Enter&quot;];
  const back = [&quot;ArrowLeft&quot;, &quot;ArrowUp&quot;, &quot;PageUp&quot;, &quot;Backspace&quot;];
  addEventListener(&quot;keydown&quot;, (event) => {
    if (forward.includes(event.key) &amp;&amp; stage() === stages.length) send(&quot;next&quot;);
    else if (back.includes(event.key) &amp;&amp; stage() === 1) send(&quot;prev&quot;);
    else return;
    event.preventDefault();
    event.stopImmediatePropagation();
  });
  addEventListener(&quot;click&quot;, (event) => {
    if (event.target.closest?.(&quot;a&quot;)) return;
    if (!event.shiftKey &amp;&amp; stage() === stages.length) send(&quot;next&quot;);
    else if (event.shiftKey &amp;&amp; stage() === 1) send(&quot;prev&quot;);
    else return;
    event.stopImmediatePropagation();
  });
  addEventListener(&quot;DOMContentLoaded&quot;, () => {
    const deck = document.getElementById(&quot;deck&quot;);
    new MutationObserver(() => send(&quot;stage&quot;)).observe(deck, { attributes: true, attributeFilter: [&quot;data-stage&quot;] });
  });
})();

  <script>
    const stages = [
      {
        title: &quot;Codebase Memory&quot;,
        line: &quot;Give the agent a map of the repository, so it can ask about structure instead of reading file after file.&quot;
      },
      {
        title: &quot;Agents explore by reading&quot;,
        line: &quot;To answer a question about structure, an agent searches and reads file after file. Everything it reads stays in the context.&quot;
      },
      {
        title: &quot;Index once, query many times&quot;,
        line: &quot;Codebase memory parses the repository ahead of time. The agent asks a structural question and gets a short, precise answer.&quot;
      },
      {
        title: &quot;How it works&quot;,
        line: &quot;A local indexer builds a graph of the code, and an MCP server gives the agent tools to query it.&quot;
      },
      {
        title: &quot;What the agent can ask&quot;,
        line: &quot;The graph stores symbols and the relationships between them, so a question about structure becomes one query.&quot;
      },
      {
        title: &quot;Where it fits&quot;,
        line: &quot;The bigger and less familiar the codebase, the more a map is worth.&quot;
      },
      {
        title: &quot;What it saves, what it costs&quot;,
        line: &quot;Fewer and smaller reads, paid for with tool definitions in every call and a one-time index build.&quot;
      },
      {
        title: &quot;One option among several&quot;,
        line: &quot;We use Codebase Memory MCP in the workshop. Other tools give the agent code context in different ways.&quot;
      },
      {
        title: &quot;A quick test on Storzy&quot;,
        line: &quot;Ask the same question with and without Codebase Memory, then compare cost, tool calls, time, and the answer.&quot;
      },
      {
        title: &quot;Turn it on&quot;,
        line: &quot;Configure it once. It stays on for the enhanced implementation task at the end.&quot;
      }
    ];
  </script>
  <script>
    (() => {
      const deck = document.getElementById(&quot;deck&quot;);
      const head = deck.querySelector(&quot;.head&quot;);
      const title = document.getElementById(&quot;title&quot;);
      const line = document.getElementById(&quot;line&quot;);
      const progress = deck.querySelector(&quot;.progress&quot;);
      stages.forEach(() => progress.appendChild(document.createElement(&quot;i&quot;)));
      const bars = Array.from(progress.children);

      const matcher = (spec) => {
        const parts = spec.split(&quot;,&quot;).map((part) => part.trim());
        return (n) => parts.some((part) => {
          if (!part.includes(&quot;-&quot;)) return n === Number(part);
          const [from, to] = part.split(&quot;-&quot;);
          return n >= Number(from) &amp;&amp; (to === &quot;&quot; || n <= Number(to));
        });
      };
      const shown = Array.from(deck.querySelectorAll(&quot;[data-on]&quot;)).map((el) => ({ el, test: matcher(el.dataset.on) }));

      let current = 0;
      let swapTimer;

      const setText = () => {
        title.textContent = stages[current].title;
        line.textContent = stages[current].line;
        document.title = stages[current].title;
      };

      const go = (index, syncHash = true) => {
        current = Math.max(0, Math.min(stages.length - 1, index));
        const n = current + 1;
        deck.dataset.stage = String(n);
        clearTimeout(swapTimer);
        if (deck.dataset.ready === &quot;true&quot;) {
          head.classList.add(&quot;fade&quot;);
          swapTimer = setTimeout(() => { setText(); head.classList.remove(&quot;fade&quot;); }, 180);
        } else {
          setText();
        }
        shown.forEach(({ el, test }) => el.classList.toggle(&quot;on&quot;, test(n)));
        bars.forEach((bar, i) => bar.classList.toggle(&quot;on&quot;, i <= current));
        if (syncHash) try { history.replaceState(null, &quot;&quot;, `#${n}`); } catch {}
      };

      const fromHash = () => {
        const n = Number(location.hash.slice(1));
        return Number.isInteger(n) &amp;&amp; n >= 1 &amp;&amp; n <= stages.length ? n - 1 : 0;
      };

      const scale = () => {
        const s = Math.min(innerWidth / 1920, innerHeight / 1080);
        deck.style.transform = `translate(-50%, -50%) scale(${s})`;
      };

      addEventListener(&quot;resize&quot;, scale);
      addEventListener(&quot;hashchange&quot;, () => go(fromHash(), false));
      addEventListener(&quot;click&quot;, (event) => go(current + (event.shiftKey ? -1 : 1)));
      addEventListener(&quot;keydown&quot;, (event) => {
        const forward = [&quot;ArrowRight&quot;, &quot;ArrowDown&quot;, &quot; &quot;, &quot;PageDown&quot;, &quot;Enter&quot;];
        const back = [&quot;ArrowLeft&quot;, &quot;ArrowUp&quot;, &quot;PageUp&quot;, &quot;Backspace&quot;];
        if (forward.includes(event.key)) go(current + 1);
        else if (back.includes(event.key)) go(current - 1);
        else if (event.key === &quot;Home&quot;) go(0);
        else if (event.key === &quot;End&quot;) go(stages.length - 1);
        else return;
        event.preventDefault();
      });

      scale();
      go(fromHash(), false);
      requestAnimationFrame(() => requestAnimationFrame(() => { deck.dataset.ready = &quot;true&quot;; }));
    })();
  </script>
</body>

"></iframe>
  <script>
    (() => {
      const counts = [10,13,12,12,9,10];
      const frames = Array.from(document.querySelectorAll("iframe"));
      const offsets = counts.map((_, i) => counts.slice(0, i).reduce((a, b) => a + b, 0));
      const total = counts.reduce((a, b) => a + b, 0);
      let active = 0;

      const press = (frame, key) => frame.contentWindow.dispatchEvent(new KeyboardEvent("keydown", { key, cancelable: true }));
      const stageOf = (frame) => Number(frame.contentDocument.getElementById("deck").dataset.stage);

      const sync = () => {
        const frame = frames[active];
        history.replaceState(null, "", "#" + (offsets[active] + stageOf(frame)));
        document.title = frame.contentDocument.title;
      };

      const show = (index, key) => {
        active = index;
        frames.forEach((frame, i) => frame.classList.toggle("active", i === index));
        if (key) press(frames[index], key);
        frames[index].contentWindow.focus();
        sync();
      };

      const open = (n) => {
        n = Math.max(1, Math.min(total, n));
        const index = offsets.findLastIndex((offset) => offset < n);
        show(index, "Home");
        for (let i = 1; i < n - offsets[index]; i++) press(frames[index], "ArrowDown");
        sync();
      };

      // Called synchronously from a deck's key or click handler, so fast presses are not lost.
      window.deckNav = (source, type) => {
        if (frames[active].contentWindow !== source) return;
        if (type === "next" && active < frames.length - 1) show(active + 1, "Home");
        else if (type === "prev" && active > 0) show(active - 1, "End");
        else if (type === "stage") sync();
      };

      addEventListener("hashchange", () => open(Number(location.hash.slice(1)) || 1));

      // Keys pressed before the first click land on this page; pass them to the visible deck.
      addEventListener("keydown", (event) => {
        press(frames[active], event.key);
        frames[active].contentWindow.focus();
        event.preventDefault();
      });

      let loaded = 0;
      frames.forEach((frame) => frame.addEventListener("load", () => {
        if (++loaded === frames.length) open(Number(location.hash.slice(1)) || 1);
      }));
    })();
  </script>
