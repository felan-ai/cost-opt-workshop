    .lead-card { position: absolute; top: 10px; width: 810px; height: 540px; display: flex; overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: var(--s1); }
    .lead-card.milko { left: 0; border-top: 5px solid var(--green-hi); }
    .lead-card.yavor { right: 0; border-top: 5px solid var(--blue); }
    .lead-card img { flex: none; width: 330px; height: 100%; object-fit: cover; object-position: center 8%; border-right: 1px solid var(--line); }
    .lead-card &gt; div { padding: 40px 38px; }
    .lead-card h2 { margin: 0; color: var(--ink); font-size: 44px; line-height: 1.1; letter-spacing: -0.02em; }
    .lead-card .eyebrow { margin-top: 14px; font-size: 18px; letter-spacing: 0.06em; }
    .lead-card.yavor .eyebrow { color: var(--blue); }
    .lead-card p { margin: 26px 0 0; color: var(--muted); font-size: 24px; line-height: 1.45; }

    #deck[data-stage=&quot;1&quot;] .head { visibility: hidden; }
    .ws-title { top: 0; left: 120px; width: 1680px; height: 1080px; }
    .ws-title .eyebrow { position: absolute; top: 250px; left: 0; }
    .ws-title h1 { position: absolute; top: 300px; left: 0; width: 1500px; margin: 0; font-size: 120px; font-weight: 800; line-height: 1.02; letter-spacing: -0.04em; background: linear-gradient(to bottom, #fff 0%, rgba(255, 255, 255, 0.72) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .ws-title .tagline { position: absolute; top: 580px; left: 0; margin: 0; color: var(--ink); font-size: 40px; font-weight: 600; letter-spacing: -0.015em; }
    .ws-title .summary { position: absolute; top: 650px; left: 0; width: 1240px; margin: 0; color: var(--muted); font-size: 30px; line-height: 1.45; }
  &lt;/style&gt;
&lt;/head&gt;

&lt;body&gt;
  &lt;main id=&quot;deck&quot; data-stage=&quot;1&quot; data-ready=&quot;false&quot;&gt;
    &lt;div class=&quot;orb orb-green&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;orb orb-blue&quot;&gt;&lt;/div&gt;

    &lt;header class=&quot;head&quot;&gt;
      &lt;h1 id=&quot;title&quot;&gt;&lt;/h1&gt;
      &lt;p id=&quot;line&quot;&gt;&lt;/p&gt;
    &lt;/header&gt;

    &lt;!-- 1: workshop title --&gt;
    &lt;div class=&quot;abs ws-title&quot; data-on=&quot;1&quot;&gt;
      &lt;div class=&quot;eyebrow&quot;&gt;Workshop · 12 November 2026&lt;/div&gt;
      &lt;h1&gt;Get More from Your AI Coding Budget&lt;/h1&gt;
      &lt;p class=&quot;tagline&quot;&gt;A hands-on cost optimization workshop for AI coding agents.&lt;/p&gt;
      &lt;p class=&quot;summary&quot;&gt;Learn where coding-agent cost really comes from, then optimize model choice, context, sessions, and tool output without sacrificing verified results.&lt;/p&gt;
    &lt;/div&gt;

    &lt;section class=&quot;board&quot; aria-label=&quot;Agent loop and token economics diagram&quot;&gt;
      &lt;!-- 2: workshop leads --&gt;
      &lt;div class=&quot;abs&quot; data-on=&quot;2&quot; style=&quot;inset: 0&quot;&gt;
        &lt;article class=&quot;lead-card milko&quot;&gt;
          &lt;img src=&quot;assets/milko-slavov.webp&quot; alt=&quot;Illustrated portrait of Milko Slavov&quot;&gt;
          &lt;div&gt;
            &lt;h2&gt;Milko Slavov&lt;/h2&gt;
            &lt;div class=&quot;eyebrow&quot;&gt;Founder, Felan&lt;/div&gt;
            &lt;p&gt;20+ years as an engineer, Staff Engineer, architect, and CTO, including more than a decade at VMware on cloud services, platform architecture, and Kubernetes-based infrastructure. Now builds autonomous SDLC agents at Felan.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/article&gt;
        &lt;article class=&quot;lead-card yavor&quot; style=&quot;--d: 120ms&quot;&gt;
          &lt;img src=&quot;assets/yavor-boychev.webp&quot; alt=&quot;Illustrated portrait of Yavor Boychev&quot;&gt;
          &lt;div&gt;
            &lt;h2&gt;Yavor Boychev&lt;/h2&gt;
            &lt;div class=&quot;eyebrow&quot;&gt;Co-founder, Felan&lt;/div&gt;
            &lt;p&gt;20+ years as a hands-on engineer and engineering leader at VMware, Docker, Mirantis, Carbon Black, and OfficeRnD: cloud automation, SaaS platforms, developer tooling, and distributed teams.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/article&gt;
      &lt;/div&gt;

      &lt;!-- 4: billing arrangements and why cost matters --&gt;
      &lt;div class=&quot;abs&quot; data-on=&quot;4&quot; style=&quot;inset: 0&quot;&gt;
        &lt;article class=&quot;billing-card metered&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;METERED API&lt;/div&gt;
          &lt;h2&gt;Pay per token&lt;/h2&gt;
          &lt;p&gt;Every input, cache and output token is billed at the provider&#x27;s price.&lt;/p&gt;
          &lt;div class=&quot;why&quot;&gt;&lt;span&gt;Why cost matters&lt;/span&gt;Fewer, cheaper tokens per task mean a smaller invoice at the end of the month.&lt;/div&gt;
        &lt;/article&gt;
        &lt;article class=&quot;billing-card subscription&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;SUBSCRIPTION&lt;/div&gt;
          &lt;h2&gt;Fixed fee with usage limits&lt;/h2&gt;
          &lt;p&gt;A monthly seat with included usage and limits that reset.&lt;/p&gt;
          &lt;div class=&quot;why&quot;&gt;&lt;span&gt;Why cost matters&lt;/span&gt;A cheaper task uses less of the limit, so you get more work done before you are throttled or need a higher tier.&lt;/div&gt;
        &lt;/article&gt;
        &lt;article class=&quot;billing-card hybrid&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;HYBRID&lt;/div&gt;
          &lt;h2&gt;Included usage, then pay for more&lt;/h2&gt;
          &lt;p&gt;A subscription or commitment, plus credits or overage once it runs out.&lt;/p&gt;
          &lt;div class=&quot;why&quot;&gt;&lt;span&gt;Why cost matters&lt;/span&gt;The included usage lasts longer, and less spills over into paid overage.&lt;/div&gt;
        &lt;/article&gt;
        &lt;div class=&quot;definition if-def&quot;&gt;&lt;b&gt;The lever is the same on every plan:&lt;/b&gt; fewer and cheaper tokens for each finished task.&lt;/div&gt;
      &lt;/div&gt;

      &lt;!-- 5: model and agent --&gt;
      &lt;div class=&quot;abs&quot; data-on=&quot;5&quot; style=&quot;inset: 0&quot;&gt;
        &lt;article class=&quot;actor model&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;LLM&lt;/div&gt;
          &lt;h2&gt;The stateless expert&lt;/h2&gt;
          &lt;div class=&quot;tagline&quot;&gt;Reads one supplied context and produces one response.&lt;/div&gt;
          &lt;ul&gt;
            &lt;li&gt;Understands text, code, images, and structured tool requests&lt;/li&gt;
            &lt;li&gt;Reasons over only what is present in this model call&lt;/li&gt;
            &lt;li&gt;Has no conversation memory between calls&lt;/li&gt;
          &lt;/ul&gt;
        &lt;/article&gt;
        &lt;article class=&quot;actor agent&quot; style=&quot;--d: 160ms&quot;&gt;
          &lt;div class=&quot;eyebrow&quot; style=&quot;color: var(--blue)&quot;&gt;Agent&lt;/div&gt;
          &lt;h2&gt;The software around it&lt;/h2&gt;
          &lt;div class=&quot;tagline&quot;&gt;Maintains the task and orchestrates the loop.&lt;/div&gt;
          &lt;ul&gt;
            &lt;li&gt;Maintains task state and conversation history&lt;/li&gt;
            &lt;li&gt;Assembles context and calls the model&lt;/li&gt;
            &lt;li&gt;Executes tools and attaches their results&lt;/li&gt;
            &lt;li&gt;Continues the loop or returns control to the user&lt;/li&gt;
          &lt;/ul&gt;
        &lt;/article&gt;
        &lt;div class=&quot;actor-note&quot;&gt;The model knows only what the agent sends in the current call.&lt;/div&gt;
      &lt;/div&gt;

      &lt;!-- 6: agent-first role sequence --&gt;
      &lt;div class=&quot;abs variant-a&quot; data-on=&quot;6&quot; style=&quot;inset: 0&quot;&gt;
        &lt;div class=&quot;loop-flow&quot;&gt;
        &lt;div class=&quot;ctx-panel reveal-item&quot; data-step=&quot;4&quot;&gt;
          &lt;h2&gt;Context&lt;/h2&gt;
          &lt;div class=&quot;ctx-sub&quot;&gt;what the agent sends on each call&lt;/div&gt;
          &lt;div class=&quot;ctx-layer&quot;&gt;System and developer instructions&lt;/div&gt;
          &lt;div class=&quot;ctx-layer&quot;&gt;Tools and repository guidance&lt;/div&gt;
          &lt;div class=&quot;ctx-layer&quot;&gt;Skills and retrieved memory&lt;/div&gt;
          &lt;div class=&quot;ctx-layer task&quot;&gt;User task&lt;/div&gt;
          &lt;div class=&quot;ctx-layer result reveal-item&quot; data-step=&quot;8&quot;&gt;Read result&lt;span class=&quot;ctx-tag&quot;&gt;+ Call 2&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;ctx-layer result reveal-item&quot; data-step=&quot;10&quot;&gt;Test result&lt;span class=&quot;ctx-tag&quot;&gt;+ Call 3&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;loop-prompt&quot;&gt;user: Fix the failing catalog test&lt;/div&gt;

        &lt;div class=&quot;varrow reveal-item first-arrow&quot; data-step=&quot;1&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;role-box agent-role reveal-item top-row first-agent&quot; data-step=&quot;1&quot;&gt;
          &lt;b&gt;Agent&lt;/b&gt;
          &lt;p&gt;Assembles context&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;role-box model-role reveal-item top-row&quot; data-step=&quot;4&quot; style=&quot;left: 806px&quot;&gt;
          &lt;div class=&quot;model-heading&quot;&gt;&lt;b&gt;Model&lt;/b&gt;&lt;span class=&quot;model-call&quot;&gt;(Call 1)&lt;/span&gt;&lt;/div&gt;
          &lt;p&gt;Process input; Requests a file read: “Read the failing test.”&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;role-box agent-role reveal-item top-row&quot; data-step=&quot;6&quot; style=&quot;left: 1112px&quot;&gt;
          &lt;b&gt;Agent&lt;/b&gt;
          &lt;p&gt;Reads the test locally; Adds its content to the next context input.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;role-box model-role reveal-item top-row&quot; data-step=&quot;8&quot; style=&quot;left: 1418px&quot;&gt;
          &lt;div class=&quot;model-heading&quot;&gt;&lt;b&gt;Model&lt;/b&gt;&lt;span class=&quot;model-call&quot;&gt;(Call 2)&lt;/span&gt;&lt;/div&gt;
          &lt;p&gt;Process input; Requests an edit: “Update the assertion.”&lt;/p&gt;
        &lt;/div&gt;

        &lt;div class=&quot;arrow role-arrow reveal-item&quot; data-step=&quot;4&quot; style=&quot;left: 768px&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;role-label top-label reveal-item&quot; data-step=&quot;4&quot; style=&quot;left: 664px&quot;&gt;Context / input&lt;/div&gt;
        &lt;div class=&quot;arrow role-arrow reveal-item&quot; data-step=&quot;6&quot; style=&quot;left: 1074px&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;role-label top-label reveal-item&quot; data-step=&quot;6&quot; style=&quot;left: 970px&quot;&gt;Tool request&lt;/div&gt;
        &lt;div class=&quot;arrow role-arrow reveal-item&quot; data-step=&quot;8&quot; style=&quot;left: 1380px&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;role-label top-label reveal-item&quot; data-step=&quot;8&quot; style=&quot;left: 1276px&quot;&gt;Read result → context&lt;/div&gt;

        &lt;div class=&quot;varrow reveal-item&quot; data-step=&quot;9&quot; style=&quot;left: 1548px; top: 354px; height: 30px&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;role-box agent-role reveal-item bottom-row&quot; data-step=&quot;9&quot; style=&quot;left: 1418px&quot;&gt;
          &lt;b&gt;Agent&lt;/b&gt;
          &lt;p&gt;Edits the file; Runs tests; Adds tool output to the next context input.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;role-label bottom-label reveal-item&quot; data-step=&quot;10&quot; style=&quot;left: 1276px&quot;&gt;Test result → context&lt;/div&gt;
        &lt;div class=&quot;arrow left bottom-arrow reveal-item&quot; data-step=&quot;10&quot; style=&quot;left: 1380px&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;role-box model-role reveal-item bottom-row&quot; data-step=&quot;10&quot; style=&quot;left: 1112px&quot;&gt;
          &lt;div class=&quot;model-heading&quot;&gt;&lt;b&gt;Model&lt;/b&gt;&lt;span class=&quot;model-call&quot;&gt;(Call 3)&lt;/span&gt;&lt;/div&gt;
          &lt;p&gt;Process input; All tests pass.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;role-label bottom-label reveal-item&quot; data-step=&quot;11&quot; style=&quot;left: 970px&quot;&gt;turn_end&lt;/div&gt;
        &lt;div class=&quot;arrow left bottom-arrow reveal-item&quot; data-step=&quot;11&quot; style=&quot;left: 1074px&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;role-box agent-role reveal-item bottom-row&quot; data-step=&quot;11&quot; style=&quot;left: 806px&quot;&gt;
          &lt;b&gt;Agent&lt;/b&gt;
          &lt;p&gt;Receives the assistant message with end-of-turn metadata; Returns control to the user.&lt;/p&gt;
        &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;overlay-step&quot; data-overlay=&quot;2&quot;&gt;
          &lt;div class=&quot;context-box&quot;&gt;
            &lt;h2&gt;CONTEXT&lt;/h2&gt;
            &lt;p&gt;The information the agent assembles and sends to the model for one call.&lt;/p&gt;
            &lt;div class=&quot;context-groups&quot;&gt;
              &lt;div class=&quot;context-group stable&quot;&gt;
                &lt;h3&gt;Stable setup&lt;/h3&gt;
                &lt;div&gt;System and developer instructions&lt;/div&gt;
                &lt;div&gt;Tool definitions&lt;/div&gt;
                &lt;div&gt;Repository instructions&lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;context-group task&quot;&gt;
                &lt;h3&gt;Task and guidance&lt;/h3&gt;
                &lt;div&gt;User prompt&lt;/div&gt;
                &lt;div&gt;Skills and retrieved memory&lt;/div&gt;
                &lt;div&gt;Relevant files&lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;context-group history&quot;&gt;
                &lt;h3&gt;Conversation so far&lt;/h3&gt;
                &lt;div&gt;Earlier assistant messages&lt;/div&gt;
                &lt;div&gt;Tool results and command output&lt;/div&gt;
                &lt;div&gt;Summary or compacted history&lt;/div&gt;
              &lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;context-foot&quot;&gt;An agent chooses what to include; not every item appears in every call.&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;overlay-step&quot; data-overlay=&quot;3&quot;&gt;
          &lt;div class=&quot;input-flow&quot;&gt;
            &lt;div class=&quot;if-stack&quot;&gt;
              &lt;h2&gt;One call&#x27;s context&lt;/h2&gt;
              &lt;div class=&quot;if-layer&quot;&gt;System and developer instructions&lt;/div&gt;
              &lt;div class=&quot;if-layer&quot;&gt;Tools and repository guidance&lt;/div&gt;
              &lt;div class=&quot;if-layer&quot;&gt;Skills and retrieved memory&lt;/div&gt;
              &lt;div class=&quot;if-layer task&quot;&gt;User task&lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;arrow if-arrow&quot;&gt;&lt;/div&gt;
            &lt;div class=&quot;if-label&quot;&gt;tokenize&lt;/div&gt;
            &lt;div class=&quot;if-model&quot;&gt;&lt;b&gt;Model&lt;/b&gt;&lt;span&gt;receives input tokens&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;definition if-def&quot;&gt;&lt;b&gt;Input tokens&lt;/b&gt; are the tokenized representation of the context sent on this call. Tokens are pieces of text, not necessarily whole words.&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;overlay-step&quot; data-overlay=&quot;5&quot;&gt;
          &lt;div class=&quot;input-flow&quot;&gt;
            &lt;div class=&quot;if-model of-model&quot;&gt;&lt;b&gt;Model&lt;/b&gt;&lt;span&gt;generates output tokens&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;arrow if-arrow of-arrow&quot;&gt;&lt;/div&gt;
            &lt;div class=&quot;if-label of-label&quot;&gt;response&lt;/div&gt;
            &lt;div class=&quot;if-stack of-stack&quot;&gt;
              &lt;h2&gt;Assistant message&lt;/h2&gt;
              &lt;p&gt;What it can contain&lt;/p&gt;
              &lt;div class=&quot;if-layer&quot;&gt;User-facing text&lt;/div&gt;
              &lt;div class=&quot;if-layer&quot;&gt;Tool request&lt;/div&gt;
              &lt;div class=&quot;if-layer&quot;&gt;Structured output or metadata&lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;definition if-def&quot;&gt;&lt;b&gt;Output tokens&lt;/b&gt; are what the model generates on this call.&lt;br&gt;&lt;b&gt;Assistant&lt;/b&gt; is the conversation role for a message the model produces.&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;overlay-step&quot; data-overlay=&quot;7&quot;&gt;
          &lt;div class=&quot;input-flow&quot;&gt;
            &lt;div class=&quot;tf-box assistant&quot; style=&quot;left: 60px&quot;&gt;&lt;b&gt;Tool request&lt;/b&gt;&lt;span&gt;Assistant message: “Read the failing test.”&lt;/span&gt;&lt;small&gt;Output tokens&lt;/small&gt;&lt;/div&gt;
            &lt;div class=&quot;arrow if-arrow tf-arrow&quot; style=&quot;left: 394px&quot;&gt;&lt;/div&gt;
            &lt;div class=&quot;if-label tf-label&quot; style=&quot;left: 380px&quot;&gt;request&lt;/div&gt;
            &lt;div class=&quot;tf-box agent&quot; style=&quot;left: 473px&quot;&gt;&lt;b&gt;Agent executes&lt;/b&gt;&lt;span&gt;Reads the test file in the local environment.&lt;/span&gt;&lt;small&gt;No model tokens&lt;/small&gt;&lt;/div&gt;
            &lt;div class=&quot;arrow if-arrow tf-arrow&quot; style=&quot;left: 807px&quot;&gt;&lt;/div&gt;
            &lt;div class=&quot;if-label tf-label&quot; style=&quot;left: 793px&quot;&gt;result&lt;/div&gt;
            &lt;div class=&quot;tf-box tool&quot; style=&quot;left: 886px&quot;&gt;&lt;b&gt;Tool output&lt;/b&gt;&lt;span&gt;The test file&#x27;s contents, returned to the agent.&lt;/span&gt;&lt;small&gt;Not tokens yet&lt;/small&gt;&lt;/div&gt;
            &lt;div class=&quot;arrow if-arrow tf-arrow&quot; style=&quot;left: 1220px&quot;&gt;&lt;/div&gt;
            &lt;div class=&quot;if-label tf-label&quot; style=&quot;left: 1206px&quot;&gt;attach&lt;/div&gt;
            &lt;div class=&quot;tf-box model&quot; style=&quot;left: 1299px&quot;&gt;&lt;b&gt;Model &lt;span class=&quot;tf-call&quot;&gt;(Call 2)&lt;/span&gt;&lt;/b&gt;&lt;span&gt;Receives the result as part of its context.&lt;/span&gt;&lt;small&gt;Input tokens&lt;/small&gt;&lt;/div&gt;
            &lt;div class=&quot;definition if-def&quot;&gt;&lt;b&gt;Tool execution uses no model tokens.&lt;/b&gt;&lt;br&gt;Its output costs tokens only when the agent adds it to a later call&#x27;s context.&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;!-- 7: the prompt cache --&gt;
      &lt;div class=&quot;abs cache-scene&quot; data-on=&quot;7&quot; style=&quot;inset: 0&quot;&gt;
        &lt;div class=&quot;cx-row&quot; style=&quot;top: 10px&quot;&gt;
          &lt;div class=&quot;cx-name&quot;&gt;&lt;b&gt;Call 1&lt;/b&gt;&lt;span&gt;start of the task&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;cx-bar&quot;&gt;&lt;div class=&quot;cx-seg sys&quot; style=&quot;width: 180px&quot;&gt;System&lt;/div&gt;&lt;div class=&quot;cx-seg sys&quot; style=&quot;width: 180px&quot;&gt;Tools + repo&lt;/div&gt;&lt;div class=&quot;cx-seg sys&quot; style=&quot;width: 180px&quot;&gt;Skills + memory&lt;/div&gt;&lt;div class=&quot;cx-seg task&quot; style=&quot;width: 150px&quot;&gt;User task&lt;/div&gt;&lt;div class=&quot;cx-br new&quot; style=&quot;left: 0px; width: 708px&quot;&gt;&lt;span&gt;processed in full · cached for the next call&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;cx-row reveal-item&quot; data-step=&quot;1&quot; style=&quot;top: 185px&quot;&gt;
          &lt;div class=&quot;cx-name&quot;&gt;&lt;b&gt;Call 2&lt;/b&gt;&lt;span&gt;after the read&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;cx-bar&quot;&gt;&lt;div class=&quot;cx-seg sys&quot; style=&quot;width: 180px&quot;&gt;System&lt;/div&gt;&lt;div class=&quot;cx-seg sys&quot; style=&quot;width: 180px&quot;&gt;Tools + repo&lt;/div&gt;&lt;div class=&quot;cx-seg sys&quot; style=&quot;width: 180px&quot;&gt;Skills + memory&lt;/div&gt;&lt;div class=&quot;cx-seg task&quot; style=&quot;width: 150px&quot;&gt;User task&lt;/div&gt;&lt;div class=&quot;cx-seg res&quot; style=&quot;width: 170px&quot;&gt;Read result&lt;/div&gt;&lt;div class=&quot;cx-br hit&quot; style=&quot;left: 0px; width: 708px&quot;&gt;&lt;span&gt;cache read · cheaper, faster&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cx-br new&quot; style=&quot;left: 714px; width: 170px&quot;&gt;&lt;span&gt;new input&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;cx-row reveal-item&quot; data-step=&quot;2&quot; style=&quot;top: 360px&quot;&gt;
          &lt;div class=&quot;cx-name&quot;&gt;&lt;b&gt;Call 3&lt;/b&gt;&lt;span&gt;after the test&lt;/span&gt;&lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const deck = document.getElementById(&quot;deck&quot;);
      const head = deck.querySelector(&quot;.head&quot;);
      const title = document.getElementById(&quot;title&quot;);
      const line = document.getElementById(&quot;line&quot;);
      const progress = deck.querySelector(&quot;.progress&quot;);
      stages.forEach(() =&gt; progress.appendChild(document.createElement(&quot;i&quot;)));
      const bars = Array.from(progress.children);

      const matcher = (spec) =&gt; {
        const parts = spec.split(&quot;,&quot;).map((part) =&gt; part.trim());
        return (n) =&gt; parts.some((part) =&gt; {
          if (!part.includes(&quot;-&quot;)) return n === Number(part);
          const [from, to] = part.split(&quot;-&quot;);
          return n &gt;= Number(from) &amp;&amp; (to === &quot;&quot; || n &lt;= Number(to));
        });
      };
      const shown = Array.from(deck.querySelectorAll(&quot;[data-on]&quot;)).map((el) =&gt; ({ el, test: matcher(el.dataset.on) }));

      let current = 0;
      let revealStep = 0;
      const revealCounts = new Map([[6, 11], [7, 2], [8, 3]]);
      let swapTimer;

      const revealContent = () =&gt; {
        const stage = String(current + 1);
        deck.querySelectorAll(&quot;.reveal-item&quot;).forEach((el) =&gt; {
          const scene = el.closest(&quot;[data-on]&quot;);
          const visible = scene?.dataset.on === stage &amp;&amp; Number(el.dataset.step) &lt;= revealStep;
          el.classList.toggle(&quot;is-revealed&quot;, visible);
        });
        deck.querySelectorAll(&quot;.variant-a&quot;).forEach((scene) =&gt; {
          const active = scene.dataset.on === String(current + 1);
          let any = false;
          scene.querySelectorAll(&quot;.overlay-step&quot;).forEach((overlay) =&gt; {
            const on = active &amp;&amp; Number(overlay.dataset.overlay) === revealStep;
            overlay.classList.toggle(&quot;is-on&quot;, on);
            any ||= on;
          });
          scene.classList.toggle(&quot;overlay-on&quot;, any);
          scene.classList.toggle(&quot;loop-wide&quot;, active &amp;&amp; revealStep &lt; 4);
        });
      };

      const setText = () =&gt; {
        title.textContent = stages[current].title;
        line.textContent = stages[current].line;
        document.title = stages[current].title;
      };

      const go = (index, syncHash = true) =&gt; {
        current = Math.max(0, Math.min(stages.length - 1, index));
        revealStep = 0;
        const n = current + 1;
        deck.dataset.stage = String(n);
        clearTimeout(swapTimer);
        if (deck.dataset.ready === &quot;true&quot;) {
          head.classList.add(&quot;fade&quot;);
          swapTimer = setTimeout(() =&gt; { setText(); head.classList.remove(&quot;fade&quot;); }, 180);
        } else {
          setText();
        }
        shown.forEach(({ el, test }) =&gt; el.classList.toggle(&quot;on&quot;, test(n)));
        revealContent();
        bars.forEach((bar, i) =&gt; bar.classList.toggle(&quot;on&quot;, i &lt;= current));
        if (syncHash) history.replaceState(null, &quot;&quot;, `#${n}`);
      };

      const fromHash = () =&gt; {
        const n = Number(location.hash.slice(1));
        return Number.isInteger(n) &amp;&amp; n &gt;= 1 &amp;&amp; n &lt;= stages.length ? n - 1 : 0;
      };

      const scale = () =&gt; {
        const s = Math.min(innerWidth / 1920, innerHeight / 1080);
        deck.style.transform = `translate(-50%, -50%) scale(${s})`;
      };

      addEventListener(&quot;resize&quot;, scale);
      addEventListener(&quot;hashchange&quot;, () =&gt; go(fromHash(), false));
      addEventListener(&quot;click&quot;, (event) =&gt; {
        if (event.target.closest?.(&quot;a&quot;)) return;
        if (event.shiftKey) {
          go(current - 1);
          return;
        }
        const revealCount = revealCounts.get(current + 1) ?? 0;
        if (revealStep &lt; revealCount) {
          revealStep += 1;
          revealContent();
          return;
        }
        go(current + 1);
      });
      addEventListener(&quot;keydown&quot;, (event) =&gt; {
        if (event.key === &quot;ArrowRight&quot;) {
          if (revealStep &lt; (revealCounts.get(current + 1) ?? 0)) {
            revealStep += 1;
            revealContent();
          } else {
            go(current + 1);
          }
        } else if (event.key === &quot;ArrowLeft&quot;) {
          if (revealStep &gt; 0) {
            revealStep -= 1;
            revealContent();
          } else {
            go(current - 1);
          }
        } else if ([&quot;ArrowDown&quot;, &quot; &quot;, &quot;PageDown&quot;, &quot;Enter&quot;].includes(event.key)) go(current + 1);
        else if ([&quot;ArrowUp&quot;, &quot;PageUp&quot;, &quot;Backspace&quot;].includes(event.key)) go(current - 1);
        else if (event.key === &quot;Home&quot;) go(0);
        else if (event.key === &quot;End&quot;) go(stages.length - 1);
        else return;
        event.preventDefault();
      });

      scale();
      go(fromHash(), false);
      requestAnimationFrame(() =&gt; requestAnimationFrame(() =&gt; { deck.dataset.ready = &quot;true&quot;; }));
    })();
  &lt;/script&gt;

&lt;script&gt;
(() =&gt; {
  const ID = &quot;intro&quot;;
  // An embedded deck has no URL of its own; the master deck keeps the position in its URL instead.
  history.replaceState = () =&gt; {};
  const deck = document.getElementById(&quot;deck&quot;);
  const count = () =&gt; deck.querySelector(&quot;.progress&quot;).children.length;
  const stage = () =&gt; Number(deck.dataset.stage);
  const send = (msg) =&gt; parent.postMessage(Object.assign({ masterDeck: ID }, msg), &quot;*&quot;);
  const forward = [&quot;ArrowRight&quot;, &quot;ArrowDown&quot;, &quot; &quot;, &quot;PageDown&quot;, &quot;Enter&quot;];
  const back = [&quot;ArrowLeft&quot;, &quot;ArrowUp&quot;, &quot;PageUp&quot;, &quot;Backspace&quot;];

  const handOff = (event, nav) =&gt; {
    event.stopImmediatePropagation();
    event.preventDefault();
    send({ nav });
  };

  addEventListener(&quot;keydown&quot;, (event) =&gt; {
    if (event.masterCommand) return;
    if (event.key === &quot;Home&quot;) return handOff(event, &quot;first&quot;);
    if (event.key === &quot;End&quot;) return handOff(event, &quot;last&quot;);
    if (forward.includes(event.key) &amp;&amp; stage() &gt;= count()) return handOff(event, &quot;next&quot;);
    if (back.includes(event.key) &amp;&amp; stage() &lt;= 1) return handOff(event, &quot;prev&quot;);
  }, true);

  addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.target.closest?.(&quot;a&quot;)) return;
    if (event.shiftKey &amp;&amp; stage() &lt;= 1) return handOff(event, &quot;prev&quot;);
    if (!event.shiftKey &amp;&amp; stage() &gt;= count()) return handOff(event, &quot;next&quot;);
  }, true);

  const press = (key, masterCommand) =&gt; {
    const event = new KeyboardEvent(&quot;keydown&quot;, { key, bubbles: true, cancelable: true });
    if (masterCommand) event.masterCommand = true;
    document.body.dispatchEvent(event);
  };

  addEventListener(&quot;message&quot;, ({ data }) =&gt; {
    if (!data || data.masterCommand === undefined) return;
    const cmd = data.masterCommand;
    if (cmd === &quot;key&quot;) press(data.key, false);
    else if (cmd === &quot;last&quot;) press(&quot;End&quot;, true);
    else if (cmd === &quot;goto&quot;) {
      press(&quot;Home&quot;, true);
      for (let i = 1; i &lt; data.stage; i += 1) press(&quot;ArrowDown&quot;, true);
    }

    const stages = [
      {
        title: &quot;Prewalk&quot;,
        line: &quot;One session, two models. A frontier model works until the first edit, then a cheaper model takes over. From Can Bölük&#x27;s July 2026 post at Stencil.&quot;
      },
      {
        title: &quot;You pay for reading, not writing&quot;,
        line: &quot;Every request sends the whole conversation again. The cache makes rereading cheaper, not free, and it is still most of the bill.&quot;
      },
      {
        title: &quot;One model, one long trajectory&quot;,
        line: &quot;The decisions come in the first turns. The doing comes after the first edit, when the context is biggest. One frontier model pays frontier prices for both.&quot;
      },
      {
        title: &quot;The obvious fix: plan big, execute small&quot;,
        line: &quot;The cheaper model only gets the plan, so the plan has to be complete enough for a correct solution. That takes more planning, at frontier prices. Stencil&#x27;s test: the quality held and the cost went up.&quot;
      },
      {
        title: &quot;Step 1: plan as a todo list&quot;,
        line: &quot;A hidden instruction asks the model to plan, then write a short todo list with a check for each item. Without the list, small models declared the task done too early.&quot;
      },
      {
        title: &quot;Step 2: wait for the first edit&quot;,
        line: &quot;The switch waits for the first successful edit. By then the model has picked an approach, and the approach worked in the real code.&quot;
      },
      {
        title: &quot;Step 3: switch models, drop the instruction&quot;,
        line: &quot;The cheaper model continues the same session. The planning instruction is removed, so as far as it can tell, it planned the work itself.&quot;
      },
      {
        title: &quot;What the cheaper model inherits&quot;,
        line: &quot;Prewalk hands over the whole session, not a summary of it. The switch costs one request that processes the context again, at the cheaper model&#x27;s price.&quot;
      },
      {
        title: &quot;Why switch at the first edit&quot;,
        line: &quot;A fixed turn is too late for easy tasks and too early for hard ones. The first edit also ends the frontier phase early, at a median of about 7 turns in Stencil&#x27;s runs.&quot;
      },
      {
        title: &quot;Most of the quality at about half the cost&quot;,
        line: &quot;On SWE-Bench Pro, Prewalk kept 92 to 97% of the frontier pass rate at 53 to 61% of its cost. The plan handoff kept the quality and cost more than Opus alone.&quot;
      },
      {
        title: &quot;Where the saving comes from&quot;,
        line: &quot;Quality follows who makes the decisions. Cost follows how long the frontier model keeps reading before a cheaper model takes over.&quot;
      },
      {
        title: &quot;The price: an independent review&quot;,
        line: &quot;Prewalk alone loses a few points, and the goal is a feature that works. A strong reviewer that did not write the code checks the change. It costs extra, and the cheaper model fixes what it finds.&quot;
      },
      {
        title: &quot;Prewalk by hand&quot;,
        line: &quot;Any agent can do it with three prompts and one model switch. We try it on a small checkout bug.&quot;

    (() =&gt; {
      const deck = document.getElementById(&quot;deck&quot;);
      const head = deck.querySelector(&quot;.head&quot;);
      const title = document.getElementById(&quot;title&quot;);
      const line = document.getElementById(&quot;line&quot;);
      const progress = deck.querySelector(&quot;.progress&quot;);
      stages.forEach(() =&gt; progress.appendChild(document.createElement(&quot;i&quot;)));
      const bars = Array.from(progress.children);

      const matcher = (spec) =&gt; {
        const parts = spec.split(&quot;,&quot;).map((part) =&gt; part.trim());
        return (n) =&gt; parts.some((part) =&gt; {
          if (!part.includes(&quot;-&quot;)) return n === Number(part);
          const [from, to] = part.split(&quot;-&quot;);
          return n &gt;= Number(from) &amp;&amp; (to === &quot;&quot; || n &lt;= Number(to));
        });
      };
      const shown = Array.from(deck.querySelectorAll(&quot;[data-on]&quot;)).map((el) =&gt; ({ el, test: matcher(el.dataset.on) }));

      let current = 0;
      let swapTimer;

      const setText = () =&gt; {
        title.textContent = stages[current].title;
        line.textContent = stages[current].line;
        document.title = stages[current].title;
      };

      const go = (index, syncHash = true) =&gt; {
        current = Math.max(0, Math.min(stages.length - 1, index));
        const n = current + 1;
        deck.dataset.stage = String(n);
        clearTimeout(swapTimer);
        if (deck.dataset.ready === &quot;true&quot;) {
          head.classList.add(&quot;fade&quot;);
          swapTimer = setTimeout(() =&gt; { setText(); head.classList.remove(&quot;fade&quot;); }, 180);
        } else {
          setText();
        }
        shown.forEach(({ el, test }) =&gt; el.classList.toggle(&quot;on&quot;, test(n)));
        bars.forEach((bar, i) =&gt; bar.classList.toggle(&quot;on&quot;, i &lt;= current));
        if (syncHash) history.replaceState(null, &quot;&quot;, `#${n}`);
      };

      const fromHash = () =&gt; {
        const n = Number(location.hash.slice(1));
        return Number.isInteger(n) &amp;&amp; n &gt;= 1 &amp;&amp; n &lt;= stages.length ? n - 1 : 0;
      };

      const scale = () =&gt; {
        const s = Math.min(innerWidth / 1920, innerHeight / 1080);
        deck.style.transform = `translate(-50%, -50%) scale(${s})`;
      };

      addEventListener(&quot;resize&quot;, scale);
      addEventListener(&quot;hashchange&quot;, () =&gt; go(fromHash(), false));
      addEventListener(&quot;click&quot;, (event) =&gt; go(current + (event.shiftKey ? -1 : 1)));
      addEventListener(&quot;keydown&quot;, (event) =&gt; {
        const forward = [&quot;ArrowRight&quot;, &quot;ArrowDown&quot;, &quot; &quot;, &quot;PageDown&quot;, &quot;Enter&quot;];
        const back = [&quot;ArrowLeft&quot;, &quot;ArrowUp&quot;, &quot;PageUp&quot;, &quot;Backspace&quot;];
        if (forward.includes(event.key)) go(current + 1);
        else if (back.includes(event.key)) go(current - 1);
        else if (event.key === &quot;Home&quot;) go(0);
        else if (event.key === &quot;End&quot;) go(stages.length - 1);
        else return;
        event.preventDefault();
      });

      scale();
      go(fromHash(), false);
      requestAnimationFrame(() =&gt; requestAnimationFrame(() =&gt; { deck.dataset.ready = &quot;true&quot;; }));
    })();
  &lt;/script&gt;

&lt;script&gt;
(() =&gt; {
  const ID = &quot;prewalk&quot;;
  // An embedded deck has no URL of its own; the master deck keeps the position in its URL instead.
  history.replaceState = () =&gt; {};
  const deck = document.getElementById(&quot;deck&quot;);
  const count = () =&gt; deck.querySelector(&quot;.progress&quot;).children.length;
  const stage = () =&gt; Number(deck.dataset.stage);
  const send = (msg) =&gt; parent.postMessage(Object.assign({ masterDeck: ID }, msg), &quot;*&quot;);
  const forward = [&quot;ArrowRight&quot;, &quot;ArrowDown&quot;, &quot; &quot;, &quot;PageDown&quot;, &quot;Enter&quot;];
  const back = [&quot;ArrowLeft&quot;, &quot;ArrowUp&quot;, &quot;PageUp&quot;, &quot;Backspace&quot;];

  const handOff = (event, nav) =&gt; {
    event.stopImmediatePropagation();
    event.preventDefault();
    send({ nav });
  };

  addEventListener(&quot;keydown&quot;, (event) =&gt; {
    if (event.masterCommand) return;
    if (event.key === &quot;Home&quot;) return handOff(event, &quot;first&quot;);
    if (event.key === &quot;End&quot;) return handOff(event, &quot;last&quot;);
    if (forward.includes(event.key) &amp;&amp; stage() &gt;= count()) return handOff(event, &quot;next&quot;);
    if (back.includes(event.key) &amp;&amp; stage() &lt;= 1) return handOff(event, &quot;prev&quot;);
  }, true);

  addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.target.closest?.(&quot;a&quot;)) return;
    if (event.shiftKey &amp;&amp; stage() &lt;= 1) return handOff(event, &quot;prev&quot;);
    if (!event.shiftKey &amp;&amp; stage() &gt;= count()) return handOff(event, &quot;next&quot;);
  }, true);

  const press = (key, masterCommand) =&gt; {
    const event = new KeyboardEvent(&quot;keydown&quot;, { key, bubbles: true, cancelable: true });
    if (masterCommand) event.masterCommand = true;
    document.body.dispatchEvent(event);
  };

  addEventListener(&quot;message&quot;, ({ data }) =&gt; {
    if (!data || data.masterCommand === undefined) return;
    const cmd = data.masterCommand;
    if (cmd === &quot;key&quot;) press(data.key, false);
    else if (cmd === &quot;last&quot;) press(&quot;End&quot;, true);
    else if (cmd === &quot;goto&quot;) {
      press(&quot;Home&quot;, true);
      for (let i = 1; i &lt; data.stage; i += 1) press(&quot;ArrowDown&quot;, true);
    }
  });

  new MutationObserver(() =&gt; send({ stage: stage(), count: count() }))
    .observe(deck, { attributes: true, attributeFilter: [&quot;data-stage&quot;] });
  send({ ready: true, stage: stage(), count: count() });
})();

    .ev-row .lbl { display: flex; justify-content: space-between; color: var(--ink); font-size: 22px; }
    .ev-row .lbl span { color: var(--muted); }
    .ev-row .track { height: 14px; margin-top: 8px; overflow: hidden; border-radius: 7px; background: var(--s3); }
    .ev-row .track i { display: block; height: 100%; border-radius: 7px; }
    .ev-card small { display: block; margin-top: 22px; color: var(--faint); font-size: 18px; line-height: 1.35; }

    /* 10: cost of compacting */
    .cbar { position: absolute; bottom: 60px; width: 150px; display: flex; flex-direction: column-reverse; overflow: hidden; border-radius: 8px; }
    .cbar i { display: block; }
    .cbar .hit { background: hsl(152 46% 34% / 0.6); }
    .cbar .miss { background: hsl(30 10% 88%); }
    .cbar .sum { background: var(--amber); }
    .cbar-label { position: absolute; bottom: 10px; width: 150px; color: var(--muted); font-size: 24px; text-align: center; }
    .legend { position: absolute; top: 0; right: 0; display: flex; flex-direction: column; gap: 14px; font-size: 24px; color: var(--muted); }
    .legend span { display: flex; align-items: center; gap: 14px; }
    .legend i { width: 26px; height: 26px; border-radius: 6px; }
    .cost-note { position: absolute; top: 0; width: 600px; height: 150px; padding: 18px 24px; border: 1px solid var(--line); border-radius: 10px; background: var(--s1); color: var(--muted); font-size: 21px; line-height: 1.35; }
    .cost-note b { display: block; margin-bottom: 4px; color: var(--ink); font-size: 25px; }

    /* 11: when to keep, restart, or compact */
    .break-note { position: absolute; top: 470px; left: 0; width: 780px; padding: 18px 24px; border: 1px solid hsl(40 85% 62% / 0.4); border-radius: 12px; background: hsl(40 85% 50% / 0.08); color: var(--muted); font-size: 22px; line-height: 1.4; }
    .break-note b { display: block; margin-bottom: 4px; color: var(--amber); font-size: 25px; }
    .phase { position: absolute; top: 270px; height: 76px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); background: var(--s2); color: var(--ink); font-size: 26px; font-weight: 600; }
    .phase.idle { background: repeating-linear-gradient(135deg, var(--s1) 0 12px, var(--s2) 12px 24px); color: var(--muted); }
    .mark { position: absolute; width: 3px; }
    .mark.yes { background: var(--green-hi); }
    .mark.no { background: hsl(4 72% 64%); }
    .note { position: absolute; width: 440px; font-size: 27px; font-weight: 600; line-height: 1.3; }
    .note span { display: block; margin-top: 6px; color: var(--muted); font-size: 24px; font-weight: 400; }
    .note code { color: var(--ink); font-family: var(--mono); font-size: 22px; font-weight: 500; }
    .note.yes { color: var(--green-hi); }
    .note.no { color: hsl(4 80% 72%); }
  &lt;/style&gt;
&lt;/head&gt;

&lt;body&gt;
  &lt;main id=&quot;deck&quot; data-stage=&quot;1&quot; data-ready=&quot;false&quot;&gt;

    &lt;/header&gt;

    &lt;section class=&quot;board&quot; aria-label=&quot;Compaction diagram&quot;&gt;

          &lt;div class=&quot;seg base&quot; style=&quot;height: 110px&quot;&gt;System, tools&lt;/div&gt;
          &lt;div class=&quot;seg&quot; style=&quot;height: 50px&quot;&gt;Task&lt;/div&gt;

          &lt;div class=&quot;seg base&quot; style=&quot;height: 110px&quot;&gt;System, tools&lt;/div&gt;
          &lt;div class=&quot;seg&quot; style=&quot;height: 50px&quot;&gt;Task&lt;/div&gt;
          &lt;div class=&quot;seg&quot; style=&quot;height: 90px&quot;&gt;read&lt;/div&gt;
          &lt;div class=&quot;seg&quot; style=&quot;height: 60px&quot;&gt;grep&lt;/div&gt;
          &lt;div class=&quot;seg&quot; style=&quot;height: 120px&quot;&gt;test log&lt;/div&gt;
          &lt;div class=&quot;seg new&quot; style=&quot;height: 80px&quot;&gt;read&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;req-label&quot; style=&quot;left: 0&quot;&gt;Request 1&lt;/div&gt;
        &lt;div class=&quot;req-label&quot; style=&quot;left: 365px&quot;&gt;Request 2&lt;/div&gt;
        &lt;div class=&quot;req-label&quot; style=&quot;left: 730px&quot;&gt;Request 3&lt;/div&gt;
        &lt;div class=&quot;req-label&quot; style=&quot;left: 1095px&quot;&gt;Request 4&lt;/div&gt;
        &lt;div class=&quot;req-label&quot; style=&quot;left: 1460px&quot;&gt;Request 5&lt;/div&gt;
      &lt;/div&gt;

      &lt;!-- 3: context rot and the hard limit --&gt;
      &lt;div class=&quot;abs&quot; data-on=&quot;3&quot; style=&quot;inset: 0&quot;&gt;
        &lt;svg class=&quot;rot-chart&quot; viewBox=&quot;0 0 1680 640&quot; aria-label=&quot;Cost rises and reliability can fall as context grows, before automatic compaction and the hard limit&quot;&gt;
          &lt;defs&gt;
            &lt;linearGradient id=&quot;rot-zone&quot; x1=&quot;0&quot; x2=&quot;1&quot;&gt;
              &lt;stop offset=&quot;0&quot; stop-color=&quot;hsl(40 85% 50%)&quot; stop-opacity=&quot;0&quot; /&gt;
              &lt;stop offset=&quot;1&quot; stop-color=&quot;hsl(40 85% 50%)&quot; stop-opacity=&quot;0.12&quot; /&gt;
            &lt;/linearGradient&gt;
          &lt;/defs&gt;
          &lt;rect x=&quot;650&quot; y=&quot;30&quot; width=&quot;500&quot; height=&quot;490&quot; rx=&quot;12&quot; fill=&quot;url(#rot-zone)&quot; /&gt;
          &lt;line x1=&quot;80&quot; y1=&quot;520&quot; x2=&quot;1150&quot; y2=&quot;520&quot; stroke=&quot;hsl(30 10% 90% / 0.22)&quot; stroke-width=&quot;2&quot; /&gt;
          &lt;line x1=&quot;1070&quot; y1=&quot;30&quot; x2=&quot;1070&quot; y2=&quot;540&quot; stroke=&quot;hsl(40 85% 62% / 0.85)&quot; stroke-width=&quot;3&quot; stroke-dasharray=&quot;6 8&quot; /&gt;
          &lt;line x1=&quot;1150&quot; y1=&quot;30&quot; x2=&quot;1150&quot; y2=&quot;540&quot; stroke=&quot;hsl(4 72% 64% / 0.7)&quot; stroke-width=&quot;3&quot; stroke-dasharray=&quot;10 10&quot; /&gt;
          &lt;text x=&quot;80&quot; y=&quot;570&quot; fill=&quot;hsl(30 8% 65%)&quot; font-size=&quot;22&quot;&gt;Short context&lt;/text&gt;
          &lt;text x=&quot;1062&quot; y=&quot;22&quot; fill=&quot;hsl(40 85% 65%)&quot; font-size=&quot;22&quot; text-anchor=&quot;end&quot;&gt;Agent compacts&lt;/text&gt;
          &lt;text x=&quot;1150&quot; y=&quot;570&quot; fill=&quot;hsl(4 72% 70%)&quot; font-size=&quot;22&quot; text-anchor=&quot;middle&quot;&gt;Hard limit&lt;/text&gt;
          &lt;text x=&quot;506&quot; y=&quot;615&quot; fill=&quot;hsl(30 8% 65%)&quot; font-size=&quot;24&quot;&gt;Context used&lt;/text&gt;

          &lt;text x=&quot;80&quot; y=&quot;72&quot; fill=&quot;hsl(30 10% 92%)&quot; font-size=&quot;27&quot; font-weight=&quot;650&quot;&gt;Cost per request&lt;/text&gt;
          &lt;path d=&quot;M 80 205 C 330 197, 510 176, 670 150 S 930 95, 1070 64&quot; fill=&quot;none&quot; stroke=&quot;hsl(40 85% 58%)&quot; stroke-width=&quot;7&quot; stroke-linecap=&quot;round&quot; /&gt;
          &lt;circle cx=&quot;1070&quot; cy=&quot;64&quot; r=&quot;7&quot; fill=&quot;hsl(40 85% 58%)&quot; /&gt;
          &lt;text x=&quot;700&quot; y=&quot;200&quot; fill=&quot;hsl(40 85% 65%)&quot; font-size=&quot;23&quot;&gt;More history is sent again&lt;/text&gt;

          &lt;text x=&quot;80&quot; y=&quot;300&quot; fill=&quot;hsl(30 10% 92%)&quot; font-size=&quot;27&quot; font-weight=&quot;650&quot;&gt;Reliability&lt;/text&gt;
          &lt;path d=&quot;M 80 350 C 260 342, 390 348, 520 362 S 690 388, 760 378 S 900 425, 970 410 S 1030 452, 1070 460&quot; fill=&quot;none&quot; stroke=&quot;hsl(156 65% 58%)&quot; stroke-width=&quot;7&quot; stroke-linecap=&quot;round&quot; /&gt;
          &lt;circle cx=&quot;1070&quot; cy=&quot;460&quot; r=&quot;7&quot; fill=&quot;hsl(156 65% 58%)&quot; /&gt;
          &lt;text x=&quot;680&quot; y=&quot;335&quot; fill=&quot;hsl(40 85% 65%)&quot; font-size=&quot;23&quot;&gt;Context rot, no fixed threshold&lt;/text&gt;
        &lt;/svg&gt;
        &lt;div class=&quot;rot-card&quot; style=&quot;top: 26px&quot;&gt;
          &lt;b&gt;11 of 13&lt;/b&gt;
          &lt;span&gt;models fell below 50% of their short-context baseline at 32K tokens.&lt;/span&gt;
          &lt;small&gt;NoLiMa, ICML 2025. All models advertised context windows of at least 128K. This is one retrieval benchmark, not a universal threshold.&lt;/small&gt;
        &lt;/div&gt;
        &lt;div class=&quot;rot-card&quot; style=&quot;top: 320px&quot;&gt;
          &lt;b&gt;13.9% to 85%&lt;/b&gt;
          &lt;span&gt;performance degradation as input length grew across math, question answering, and coding.&lt;/span&gt;
          &lt;small&gt;Du et al., EMNLP 2025. The relevant information was retrieved perfectly, and inputs stayed within the advertised windows.&lt;/small&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;!-- 4: three options --&gt;
      &lt;div class=&quot;abs&quot; data-on=&quot;4&quot; style=&quot;inset: 0&quot;&gt;
        &lt;div class=&quot;choice&quot; style=&quot;left: 0&quot;&gt;
          &lt;h3&gt;Keep going&lt;/h3&gt;
          &lt;span class=&quot;tag&quot;&gt;Same session&lt;/span&gt;
          &lt;p&gt;Nothing is handed over or rewritten.&lt;/p&gt;
          &lt;ul&gt;
            &lt;li&gt;The prompt cache stays warm&lt;/li&gt;
            &lt;li&gt;Exact errors and decisions remain&lt;/li&gt;
            &lt;li&gt;Cost and context rot keep growing&lt;/li&gt;
          &lt;/ul&gt;
        &lt;/div&gt;
        &lt;div class=&quot;choice restart&quot; style=&quot;left: 580px&quot;&gt;
          &lt;h3&gt;Start fresh&lt;/h3&gt;
          &lt;span class=&quot;tag&quot;&gt;New session&lt;/span&gt;
          &lt;p&gt;Write a checked handoff, then continue in a new session on the same worktree.&lt;/p&gt;
          &lt;ul&gt;
            &lt;li&gt;The new context starts small&lt;/li&gt;
            &lt;li&gt;You control what carries over&lt;/li&gt;
            &lt;li&gt;Anything omitted is gone from context&lt;/li&gt;
          &lt;/ul&gt;
          &lt;small class=&quot;aside&quot;&gt;Same rule as the plan handoff from Prewalk: it has to be complete on its own.&lt;/small&gt;
        &lt;/div&gt;
        &lt;div class=&quot;choice compact&quot; style=&quot;left: 1160px&quot;&gt;
          &lt;h3&gt;Compact&lt;/h3&gt;
          &lt;span class=&quot;tag&quot;&gt;Same session, shorter context&lt;/span&gt;
          &lt;p&gt;The agent writes the handoff and continues.&lt;/p&gt;
          &lt;ul&gt;
            &lt;li&gt;Recent turns can stay exact&lt;/li&gt;
            &lt;li&gt;Less manual work&lt;/li&gt;
            &lt;li&gt;The summary can lose details&lt;/li&gt;
          &lt;/ul&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;!-- 5: what carries over --&gt;
      &lt;div class=&quot;abs&quot; data-on=&quot;5&quot; style=&quot;inset: 0&quot;&gt;
        &lt;div class=&quot;carry-card&quot;&gt;
          &lt;div class=&quot;kv&quot;&gt;&lt;b&gt;Goal&lt;/b&gt;&lt;span&gt;Add product search to the inventory&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;kv&quot;&gt;&lt;b&gt;Constraints&lt;/b&gt;&lt;span&gt;Never log search text, no new dependencies&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;kv&quot;&gt;&lt;b&gt;Decisions&lt;/b&gt;&lt;span&gt;Filter in the API; client-side filtering was rejected&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;kv&quot;&gt;&lt;b&gt;Changed files&lt;/b&gt;&lt;span&gt;app/api/products/route.ts, app/inventory/page.tsx&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;kv&quot;&gt;&lt;b&gt;Test results&lt;/b&gt;&lt;span&gt;catalog-api.test.ts expected 400, got 200&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;kv&quot;&gt;&lt;b&gt;Next step&lt;/b&gt;&lt;span&gt;Fix the validation, keep the query in the URL, rerun the API tests&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;carry-mode restart&quot;&gt;
          &lt;h3&gt;Restart&lt;/h3&gt;
          &lt;p&gt;Ask the agent for a handoff with these items, check it, then paste it into a new session.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;carry-mode compact&quot;&gt;
          &lt;h3&gt;Compact&lt;/h3&gt;
          &lt;p&gt;A model writes it inside the session. Pass the checklist as a focus.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;focus-prompt&quot;&gt;&lt;span&gt;Claude Code and Felan Code&lt;/span&gt;&lt;code&gt;/compact Keep the goal, constraints, rejected approaches, changed files, the exact last test result, and the next step.&lt;/code&gt;&lt;/div&gt;
      &lt;/div&gt;

      &lt;!-- 6: the window before and after compaction --&gt;
      &lt;div class=&quot;win-tag&quot; data-on=&quot;6&quot; style=&quot;top: 60px&quot;&gt;Before&lt;/div&gt;
      &lt;div class=&quot;win-tag&quot; data-on=&quot;6&quot; style=&quot;top: 60px; left: auto; right: 0; color: var(--amber)&quot;&gt;Compaction threshold&lt;/div&gt;

        &lt;div class=&quot;sg sg-tail&quot;&gt;Recent turns&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;win-tag&quot; data-on=&quot;6&quot; style=&quot;top: 300px; --d: 900ms&quot;&gt;After&lt;/div&gt;

        &lt;div class=&quot;reserve&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;sg sg-base&quot;&gt;System, tools&lt;/div&gt;
        &lt;div class=&quot;sg sg-old&quot;&gt;Checkpoint&lt;/div&gt;
        &lt;div class=&quot;sg sg-tail&quot;&gt;Recent turns&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;free-label&quot; data-on=&quot;6&quot; style=&quot;top: 386px; --d: 1500ms&quot;&gt;Room for the next turns&lt;/div&gt;

      &lt;!-- 7: summarize --&gt;

        &lt;div class=&quot;arrow&quot; style=&quot;top: 318px; left: 782px; width: 60px&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;card&quot; style=&quot;top: 40px; left: 860px; width: 820px&quot;&gt;
          &lt;div class=&quot;kv&quot;&gt;&lt;b&gt;Goal&lt;/b&gt;&lt;span&gt;Add product search to the inventory&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;kv&quot;&gt;&lt;b&gt;Constraints&lt;/b&gt;&lt;span&gt;Never log search text, no new dependencies&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;kv&quot;&gt;&lt;b&gt;Decisions&lt;/b&gt;&lt;span&gt;Filter in the API, not in the browser&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;kv&quot;&gt;&lt;b&gt;Done&lt;/b&gt;&lt;span&gt;API search by name and description&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;kv&quot;&gt;&lt;b&gt;Tests&lt;/b&gt;&lt;span&gt;catalog-api.test.ts expected 400, got 200&lt;/span&gt;&lt;/div&gt;

        &lt;/div&gt;
      &lt;/div&gt;

      &lt;!-- 8: what can break --&gt;
      &lt;div class=&quot;abs&quot; data-on=&quot;8&quot; style=&quot;inset: 0&quot;&gt;
        &lt;div class=&quot;ver&quot; style=&quot;left: 0&quot;&gt;
          &lt;h3&gt;After compaction 1&lt;/h3&gt;
          &lt;div class=&quot;fact&quot;&gt;Goal: product search&lt;/div&gt;
          &lt;div class=&quot;fact&quot;&gt;Never log search text&lt;/div&gt;
          &lt;div class=&quot;fact&quot;&gt;Client-side filtering was rejected&lt;/div&gt;
          &lt;div class=&quot;fact&quot;&gt;catalog-api.test.ts expected 400, got 200&lt;/div&gt;
          &lt;div class=&quot;fact&quot;&gt;Next: keep the query in the URL&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;ver&quot; data-on=&quot;8&quot; style=&quot;left: 580px; --d: 300ms&quot;&gt;
          &lt;h3&gt;After compaction 2&lt;/h3&gt;
          &lt;div class=&quot;fact&quot;&gt;Goal: product search&lt;/div&gt;
          &lt;div class=&quot;fact&quot;&gt;Never log search text&lt;/div&gt;
          &lt;div class=&quot;fact&quot;&gt;Client-side filtering was rejected&lt;/div&gt;
          &lt;div class=&quot;fact vague&quot;&gt;One API test was failing&lt;/div&gt;
          &lt;div class=&quot;fact&quot;&gt;Next: keep the query in the URL&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;ver&quot; data-on=&quot;8&quot; style=&quot;left: 1160px; --d: 600ms&quot;&gt;
          &lt;h3&gt;After compaction 3&lt;/h3&gt;
          &lt;div class=&quot;fact&quot;&gt;Goal: product search&lt;/div&gt;
          &lt;div class=&quot;fact lost&quot;&gt;Never log search text&lt;/div&gt;
          &lt;div class=&quot;fact lost&quot;&gt;Client-side filtering was rejected&lt;/div&gt;
          &lt;div class=&quot;fact vague&quot;&gt;Tests were fixed&lt;/div&gt;
          &lt;div class=&quot;fact&quot;&gt;Next: keep the query in the URL&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

    const stages = [

      {

        line: &quot;If the task is not done, keep going, restart from a checked handoff, or let the agent compact the session.&quot;
      },
      {
        title: &quot;What has to carry over&quot;,
        line: &quot;Restart and compaction need the same checkpoint. The difference is who writes it and how closely you can inspect it.&quot;
      },

        title: &quot;Older turns are replaced, recent turns stay&quot;,
        line: &quot;When the context is nearly full, or when you ask, the agent replaces older turns with a checkpoint. Recent turns stay exact, and the freed room goes to the next turns.&quot;
      },
      {
        title: &quot;Method 1: summarize&quot;,
        line: &quot;A model rewrites the older turns as a structured checkpoint. This is the default approach in most coding agents.&quot;
      },
      {
        title: &quot;What can break&quot;,
        line: &quot;Every rewrite can weaken exact errors, one-time constraints, rejected approaches, and claims about what was verified.&quot;

        title: &quot;Method 2: drop old tool output&quot;,
        line: &quot;Keep messages exact, then drop old tool results or reduce them to outcomes. In one benchmark it halved the cost, as summarizing did, without lowering the solve rate.&quot;
      },
      {
        title: &quot;Compacting has a cost&quot;,
        line: &quot;The summary call reads the older turns, and the next request rebuilds the cache. Compacting too often pays for both repeatedly.&quot;
      },

  &lt;script&gt;
    (() =&gt; {
      const deck = document.getElementById(&quot;deck&quot;);
      const head = deck.querySelector(&quot;.head&quot;);
      const title = document.getElementById(&quot;title&quot;);
      const line = document.getElementById(&quot;line&quot;);
      const progress = deck.querySelector(&quot;.progress&quot;);
      stages.forEach(() =&gt; progress.appendChild(document.createElement(&quot;i&quot;)));
      const bars = Array.from(progress.children);

      const matcher = (spec) =&gt; {
        const parts = spec.split(&quot;,&quot;).map((part) =&gt; part.trim());
        return (n) =&gt; parts.some((part) =&gt; {
          if (!part.includes(&quot;-&quot;)) return n === Number(part);
          const [from, to] = part.split(&quot;-&quot;);
          return n &gt;= Number(from) &amp;&amp; (to === &quot;&quot; || n &lt;= Number(to));
        });
      };
      const shown = Array.from(deck.querySelectorAll(&quot;[data-on]&quot;)).map((el) =&gt; ({ el, test: matcher(el.dataset.on) }));

      let current = 0;
      let swapTimer;

      const setText = () =&gt; {
        title.textContent = stages[current].title;
        line.textContent = stages[current].line;
        document.title = stages[current].title;
      };

      const go = (index, syncHash = true) =&gt; {
        current = Math.max(0, Math.min(stages.length - 1, index));
        const n = current + 1;
        deck.dataset.stage = String(n);
        clearTimeout(swapTimer);
        if (deck.dataset.ready === &quot;true&quot;) {
          head.classList.add(&quot;fade&quot;);
          swapTimer = setTimeout(() =&gt; { setText(); head.classList.remove(&quot;fade&quot;); }, 180);
        } else {
          setText();
        }
        shown.forEach(({ el, test }) =&gt; el.classList.toggle(&quot;on&quot;, test(n)));
        bars.forEach((bar, i) =&gt; bar.classList.toggle(&quot;on&quot;, i &lt;= current));
        if (syncHash) history.replaceState(null, &quot;&quot;, `#${n}`);
      };

      const fromHash = () =&gt; {
        const n = Number(location.hash.slice(1));
        return Number.isInteger(n) &amp;&amp; n &gt;= 1 &amp;&amp; n &lt;= stages.length ? n - 1 : 0;
      };

      const scale = () =&gt; {
        const s = Math.min(innerWidth / 1920, innerHeight / 1080);
        deck.style.transform = `translate(-50%, -50%) scale(${s})`;
      };

      addEventListener(&quot;resize&quot;, scale);
      addEventListener(&quot;hashchange&quot;, () =&gt; go(fromHash(), false));
      addEventListener(&quot;click&quot;, (event) =&gt; go(current + (event.shiftKey ? -1 : 1)));
      addEventListener(&quot;keydown&quot;, (event) =&gt; {
        const forward = [&quot;ArrowRight&quot;, &quot;ArrowDown&quot;, &quot; &quot;, &quot;PageDown&quot;, &quot;Enter&quot;];
        const back = [&quot;ArrowLeft&quot;, &quot;ArrowUp&quot;, &quot;PageUp&quot;, &quot;Backspace&quot;];
        if (forward.includes(event.key)) go(current + 1);
        else if (back.includes(event.key)) go(current - 1);
        else if (event.key === &quot;Home&quot;) go(0);
        else if (event.key === &quot;End&quot;) go(stages.length - 1);
        else return;
        event.preventDefault();
      });

      scale();
      go(fromHash(), false);
      requestAnimationFrame(() =&gt; requestAnimationFrame(() =&gt; { deck.dataset.ready = &quot;true&quot;; }));
    })();
  &lt;/script&gt;

&lt;script&gt;
(() =&gt; {
  const ID = &quot;compaction&quot;;
  // An embedded deck has no URL of its own; the master deck keeps the position in its URL instead.
  history.replaceState = () =&gt; {};
  const deck = document.getElementById(&quot;deck&quot;);
  const count = () =&gt; deck.querySelector(&quot;.progress&quot;).children.length;
  const stage = () =&gt; Number(deck.dataset.stage);
  const send = (msg) =&gt; parent.postMessage(Object.assign({ masterDeck: ID }, msg), &quot;*&quot;);
  const forward = [&quot;ArrowRight&quot;, &quot;ArrowDown&quot;, &quot; &quot;, &quot;PageDown&quot;, &quot;Enter&quot;];
  const back = [&quot;ArrowLeft&quot;, &quot;ArrowUp&quot;, &quot;PageUp&quot;, &quot;Backspace&quot;];

  const handOff = (event, nav) =&gt; {
    event.stopImmediatePropagation();
    event.preventDefault();
    send({ nav });
  };

  addEventListener(&quot;keydown&quot;, (event) =&gt; {
    if (event.masterCommand) return;
    if (event.key === &quot;Home&quot;) return handOff(event, &quot;first&quot;);
    if (event.key === &quot;End&quot;) return handOff(event, &quot;last&quot;);
    if (forward.includes(event.key) &amp;&amp; stage() &gt;= count()) return handOff(event, &quot;next&quot;);
    if (back.includes(event.key) &amp;&amp; stage() &lt;= 1) return handOff(event, &quot;prev&quot;);
  }, true);

  addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.target.closest?.(&quot;a&quot;)) return;
    if (event.shiftKey &amp;&amp; stage() &lt;= 1) return handOff(event, &quot;prev&quot;);
    if (!event.shiftKey &amp;&amp; stage() &gt;= count()) return handOff(event, &quot;next&quot;);
  }, true);

  const press = (key, masterCommand) =&gt; {
    const event = new KeyboardEvent(&quot;keydown&quot;, { key, bubbles: true, cancelable: true });
    if (masterCommand) event.masterCommand = true;
    document.body.dispatchEvent(event);
  };

  addEventListener(&quot;message&quot;, ({ data }) =&gt; {
    if (!data || data.masterCommand === undefined) return;
    const cmd = data.masterCommand;
    if (cmd === &quot;key&quot;) press(data.key, false);
    else if (cmd === &quot;last&quot;) press(&quot;End&quot;, true);
    else if (cmd === &quot;goto&quot;) {
      press(&quot;Home&quot;, true);
      for (let i = 1; i &lt; data.stage; i += 1) press(&quot;ArrowDown&quot;, true);
    }
  });

  new MutationObserver(() =&gt; send({ stage: stage(), count: count() }))
    .observe(deck, { attributes: true, attributeFilter: [&quot;data-stage&quot;] });
  send({ ready: true, stage: stage(), count: count() });
})();

        line: &quot;The same few techniques show up in every tool.&quot;

        line: &quot;A hook rewrites shell commands to run through RTK, which runs the real command and filters its output. Built-in Read and Grep tools bypass it.&quot;
      },

        line: &quot;Measured with RTK 0.36. The saving depends on the hook knowing the exact command, and this repository tells agents to run pnpm test and pnpm build.&quot;

      },

        line: &quot;Each one sees a different part of what the model reads.&quot;
      },
      {
        title: &quot;Felan Code: RTK plus its own compaction&quot;,
        line: &quot;Felan Code runs RTK when it is installed, then compacts bash and grep results itself, with or without RTK.&quot;

    (() =&gt; {
      const deck = document.getElementById(&quot;deck&quot;);
      const head = deck.querySelector(&quot;.head&quot;);
      const title = document.getElementById(&quot;title&quot;);
      const line = document.getElementById(&quot;line&quot;);
      const progress = deck.querySelector(&quot;.progress&quot;);
      stages.forEach(() =&gt; progress.appendChild(document.createElement(&quot;i&quot;)));
      const bars = Array.from(progress.children);

      const matcher = (spec) =&gt; {
        const parts = spec.split(&quot;,&quot;).map((part) =&gt; part.trim());
        return (n) =&gt; parts.some((part) =&gt; {
          if (!part.includes(&quot;-&quot;)) return n === Number(part);
          const [from, to] = part.split(&quot;-&quot;);
          return n &gt;= Number(from) &amp;&amp; (to === &quot;&quot; || n &lt;= Number(to));
        });
      };
      const shown = Array.from(deck.querySelectorAll(&quot;[data-on]&quot;)).map((el) =&gt; ({ el, test: matcher(el.dataset.on) }));

      let current = 0;
      let swapTimer;

      const setText = () =&gt; {
        title.textContent = stages[current].title;
        line.textContent = stages[current].line;
        document.title = stages[current].title;
      };

      const go = (index, syncHash = true) =&gt; {
        current = Math.max(0, Math.min(stages.length - 1, index));
        const n = current + 1;
        deck.dataset.stage = String(n);
        clearTimeout(swapTimer);
        if (deck.dataset.ready === &quot;true&quot;) {
          head.classList.add(&quot;fade&quot;);
          swapTimer = setTimeout(() =&gt; { setText(); head.classList.remove(&quot;fade&quot;); }, 180);
        } else {
          setText();
        }
        shown.forEach(({ el, test }) =&gt; el.classList.toggle(&quot;on&quot;, test(n)));
        bars.forEach((bar, i) =&gt; bar.classList.toggle(&quot;on&quot;, i &lt;= current));
        if (syncHash) history.replaceState(null, &quot;&quot;, `#${n}`);
      };

      const fromHash = () =&gt; {
        const n = Number(location.hash.slice(1));
        return Number.isInteger(n) &amp;&amp; n &gt;= 1 &amp;&amp; n &lt;= stages.length ? n - 1 : 0;
      };

      const scale = () =&gt; {
        const s = Math.min(innerWidth / 1920, innerHeight / 1080);
        deck.style.transform = `translate(-50%, -50%) scale(${s})`;
      };

      addEventListener(&quot;resize&quot;, scale);
      addEventListener(&quot;hashchange&quot;, () =&gt; go(fromHash(), false));
      addEventListener(&quot;click&quot;, (event) =&gt; go(current + (event.shiftKey ? -1 : 1)));
      addEventListener(&quot;keydown&quot;, (event) =&gt; {
        const forward = [&quot;ArrowRight&quot;, &quot;ArrowDown&quot;, &quot; &quot;, &quot;PageDown&quot;, &quot;Enter&quot;];
        const back = [&quot;ArrowLeft&quot;, &quot;ArrowUp&quot;, &quot;PageUp&quot;, &quot;Backspace&quot;];
        if (forward.includes(event.key)) go(current + 1);
        else if (back.includes(event.key)) go(current - 1);
        else if (event.key === &quot;Home&quot;) go(0);
        else if (event.key === &quot;End&quot;) go(stages.length - 1);
        else return;
        event.preventDefault();
      });

      scale();
      go(fromHash(), false);
      requestAnimationFrame(() =&gt; requestAnimationFrame(() =&gt; { deck.dataset.ready = &quot;true&quot;; }));
    })();
  &lt;/script&gt;

&lt;script&gt;
(() =&gt; {
  const ID = &quot;output&quot;;
  // An embedded deck has no URL of its own; the master deck keeps the position in its URL instead.
  history.replaceState = () =&gt; {};
  const deck = document.getElementById(&quot;deck&quot;);
  const count = () =&gt; deck.querySelector(&quot;.progress&quot;).children.length;
  const stage = () =&gt; Number(deck.dataset.stage);
  const send = (msg) =&gt; parent.postMessage(Object.assign({ masterDeck: ID }, msg), &quot;*&quot;);
  const forward = [&quot;ArrowRight&quot;, &quot;ArrowDown&quot;, &quot; &quot;, &quot;PageDown&quot;, &quot;Enter&quot;];
  const back = [&quot;ArrowLeft&quot;, &quot;ArrowUp&quot;, &quot;PageUp&quot;, &quot;Backspace&quot;];

  const handOff = (event, nav) =&gt; {
    event.stopImmediatePropagation();
    event.preventDefault();
    send({ nav });
  };

  addEventListener(&quot;keydown&quot;, (event) =&gt; {
    if (event.masterCommand) return;
    if (event.key === &quot;Home&quot;) return handOff(event, &quot;first&quot;);
    if (event.key === &quot;End&quot;) return handOff(event, &quot;last&quot;);
    if (forward.includes(event.key) &amp;&amp; stage() &gt;= count()) return handOff(event, &quot;next&quot;);
    if (back.includes(event.key) &amp;&amp; stage() &lt;= 1) return handOff(event, &quot;prev&quot;);
  }, true);

  addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.target.closest?.(&quot;a&quot;)) return;
    if (event.shiftKey &amp;&amp; stage() &lt;= 1) return handOff(event, &quot;prev&quot;);
    if (!event.shiftKey &amp;&amp; stage() &gt;= count()) return handOff(event, &quot;next&quot;);
  }, true);

  const press = (key, masterCommand) =&gt; {
    const event = new KeyboardEvent(&quot;keydown&quot;, { key, bubbles: true, cancelable: true });
    if (masterCommand) event.masterCommand = true;
    document.body.dispatchEvent(event);
  };

  addEventListener(&quot;message&quot;, ({ data }) =&gt; {
    if (!data || data.masterCommand === undefined) return;
    const cmd = data.masterCommand;
    if (cmd === &quot;key&quot;) press(data.key, false);
    else if (cmd === &quot;last&quot;) press(&quot;End&quot;, true);
    else if (cmd === &quot;goto&quot;) {
      press(&quot;Home&quot;, true);
      for (let i = 1; i &lt; data.stage; i += 1) press(&quot;ArrowDown&quot;, true);
    }
  });

  new MutationObserver(() =&gt; send({ stage: stage(), count: count() }))
    .observe(deck, { attributes: true, attributeFilter: [&quot;data-stage&quot;] });
  send({ ready: true, stage: stage(), count: count() });
})();

      const line = document.getElementById(&quot;line&quot;);
      const progress = deck.querySelector(&quot;.progress&quot;);
      stages.forEach(() =&gt; progress.appendChild(document.createElement(&quot;i&quot;)));
      const bars = Array.from(progress.children);

      const matcher = (spec) =&gt; {
        const parts = spec.split(&quot;,&quot;).map((part) =&gt; part.trim());
        return (n) =&gt; parts.some((part) =&gt; {
          if (!part.includes(&quot;-&quot;)) return n === Number(part);
          const [from, to] = part.split(&quot;-&quot;);
          return n &gt;= Number(from) &amp;&amp; (to === &quot;&quot; || n &lt;= Number(to));
        });
      };
      const shown = Array.from(deck.querySelectorAll(&quot;[data-on]&quot;)).map((el) =&gt; ({ el, test: matcher(el.dataset.on) }));

      let current = 0;
      let swapTimer;

      const setText = () =&gt; {
        title.textContent = stages[current].title;
        line.textContent = stages[current].line;
        document.title = stages[current].title;
      };

      const go = (index, syncHash = true) =&gt; {
        current = Math.max(0, Math.min(stages.length - 1, index));
        const n = current + 1;
        deck.dataset.stage = String(n);
        clearTimeout(swapTimer);
        if (deck.dataset.ready === &quot;true&quot;) {
          head.classList.add(&quot;fade&quot;);
          swapTimer = setTimeout(() =&gt; { setText(); head.classList.remove(&quot;fade&quot;); }, 180);
        } else {
          setText();
        }
        shown.forEach(({ el, test }) =&gt; el.classList.toggle(&quot;on&quot;, test(n)));
        bars.forEach((bar, i) =&gt; bar.classList.toggle(&quot;on&quot;, i &lt;= current));
        if (syncHash) history.replaceState(null, &quot;&quot;, `#${n}`);
      };

      const fromHash = () =&gt; {
        const n = Number(location.hash.slice(1));
        return Number.isInteger(n) &amp;&amp; n &gt;= 1 &amp;&amp; n &lt;= stages.length ? n - 1 : 0;
      };

      const scale = () =&gt; {
        const s = Math.min(innerWidth / 1920, innerHeight / 1080);
        deck.style.transform = `translate(-50%, -50%) scale(${s})`;
      };

      addEventListener(&quot;resize&quot;, scale);
      addEventListener(&quot;hashchange&quot;, () =&gt; go(fromHash(), false));
      addEventListener(&quot;click&quot;, (event) =&gt; go(current + (event.shiftKey ? -1 : 1)));
      addEventListener(&quot;keydown&quot;, (event) =&gt; {
        const forward = [&quot;ArrowRight&quot;, &quot;ArrowDown&quot;, &quot; &quot;, &quot;PageDown&quot;, &quot;Enter&quot;];
        const back = [&quot;ArrowLeft&quot;, &quot;ArrowUp&quot;, &quot;PageUp&quot;, &quot;Backspace&quot;];

        else if (back.includes(event.key)) go(current - 1);
        else if (event.key === &quot;Home&quot;) go(0);
        else if (event.key === &quot;End&quot;) go(stages.length - 1);
        else return;
        event.preventDefault();
      });

      scale();
      go(fromHash(), false);
      requestAnimationFrame(() =&gt; requestAnimationFrame(() =&gt; { deck.dataset.ready = &quot;true&quot;; }));
    })();

(() =&gt; {

  const forward = [&quot;ArrowRight&quot;, &quot;ArrowDown&quot;, &quot; &quot;, &quot;PageDown&quot;, &quot;Enter&quot;];
  const back = [&quot;ArrowLeft&quot;, &quot;ArrowUp&quot;, &quot;PageUp&quot;, &quot;Backspace&quot;];

  const handOff = (event, nav) =&gt; {
    event.stopImmediatePropagation();
    event.preventDefault();
    send({ nav });
  };

  addEventListener(&quot;keydown&quot;, (event) =&gt; {
    if (event.masterCommand) return;
    if (event.key === &quot;Home&quot;) return handOff(event, &quot;first&quot;);
    if (event.key === &quot;End&quot;) return handOff(event, &quot;last&quot;);
    if (forward.includes(event.key) &amp;&amp; stage() &gt;= count()) return handOff(event, &quot;next&quot;);
    if (back.includes(event.key) &amp;&amp; stage() &lt;= 1) return handOff(event, &quot;prev&quot;);

    if (!event.shiftKey &amp;&amp; stage() &gt;= count()) return handOff(event, &quot;next&quot;);

      &lt;!-- 6: where it fits --&gt;
      &lt;div class=&quot;abs&quot; data-on=&quot;6&quot; style=&quot;inset: 0&quot;&gt;
        &lt;article class=&quot;fit good&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Good fit&lt;/div&gt;
          &lt;ul&gt;
            &lt;li&gt;Large or unfamiliar codebases &lt;span&gt;that the agent cannot read end to end&lt;/span&gt;&lt;/li&gt;
            &lt;li&gt;&quot;Where is X?&quot; and &quot;who calls Y?&quot; &lt;span&gt;questions&lt;/span&gt;&lt;/li&gt;
            &lt;li&gt;Changes with many call sites &lt;span&gt;renames, API changes, refactors&lt;/span&gt;&lt;/li&gt;
            &lt;li&gt;Flows across files and services &lt;span&gt;UI, API, logging, tests&lt;/span&gt;&lt;/li&gt;
            &lt;li&gt;Repositories you work in every day &lt;span&gt;the index is built once and reused&lt;/span&gt;&lt;/li&gt;
          &lt;/ul&gt;
        &lt;/article&gt;
        &lt;article class=&quot;fit less&quot; style=&quot;--d: 120ms&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Less benefit&lt;/div&gt;
          &lt;ul&gt;
            &lt;li&gt;Small repositories &lt;span&gt;where grep and a few reads are already cheap&lt;/span&gt;&lt;/li&gt;
            &lt;li&gt;Edits where you already know the file&lt;/li&gt;
            &lt;li&gt;Behavior decided at runtime &lt;span&gt;dynamic dispatch, configuration, reflection&lt;/span&gt;&lt;/li&gt;
            &lt;li&gt;Questions the code cannot answer &lt;span&gt;product intent, logs, production data&lt;/span&gt;&lt;/li&gt;
            &lt;li&gt;Code changed since the last index &lt;span&gt;until the watcher catches up&lt;/span&gt;&lt;/li&gt;
          &lt;/ul&gt;
        &lt;/article&gt;
      &lt;/div&gt;

      &lt;!-- 7: what it saves and what it costs --&gt;
      &lt;div class=&quot;abs&quot; data-on=&quot;7&quot; style=&quot;inset: 0&quot;&gt;
        &lt;article class=&quot;ledger saves&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Saves&lt;/div&gt;
          &lt;h2&gt;Fewer, smaller reads&lt;/h2&gt;
          &lt;p&gt;Fewer exploration calls &lt;span&gt;· one query instead of a chain of searches and reads&lt;/span&gt;&lt;/p&gt;
          &lt;p&gt;Less source in the context &lt;span&gt;· a snippet or a list of callers instead of whole files&lt;/span&gt;&lt;/p&gt;
          &lt;p&gt;Less to resend &lt;span&gt;· everything read stays in the context for later calls&lt;/span&gt;&lt;/p&gt;
        &lt;/article&gt;
        &lt;article class=&quot;ledger adds&quot; style=&quot;--d: 120ms&quot;&gt;
          &lt;div class=&quot;eyebrow&quot;&gt;Costs&lt;/div&gt;
          &lt;h2&gt;A fixed overhead&lt;/h2&gt;
          &lt;p&gt;Tool definitions and instructions &lt;span&gt;· in the context of every call, used or not&lt;/span&gt;&lt;/p&gt;
          &lt;p&gt;A one-time index build &lt;span&gt;· seconds for a small repository&lt;/span&gt;&lt;/p&gt;
          &lt;p&gt;Trust in the graph &lt;span&gt;· static analysis can miss links, so the agent still reads before it edits&lt;/span&gt;&lt;/p&gt;
        &lt;/article&gt;
        &lt;div class=&quot;note&quot;&gt;The project&#x27;s own study reports &lt;b&gt;10× fewer tokens and 2.1× fewer tool calls&lt;/b&gt; across 31 repositories. Measure it on your own work.&lt;/div&gt;
      &lt;/div&gt;

        line: &quot;Give the agent a map of the repository, so it can ask about structure instead of reading file after file.&quot;
      },
