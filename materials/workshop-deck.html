  &lt;script&gt;
    (() =&gt; {
      const deck = document.getElementById(&quot;deck&quot;);
      const head = deck.querySelector(&quot;.head&quot;);
      const title = document.getElementById(&quot;title&quot;);
      const line = document.getElementById(&quot;line&quot;);
      const progress = deck.querySelector(&quot;.progress&quot;);
      stages.forEach(() =&gt; progress.appendChild(document.createElement(&quot;i&quot;)));
      const bars = Array.from(progress.children);

      const matcher = (spec) =&gt; {
        const parts = spec.split(&quot;,&quot;).map((part) =&gt; part.trim());
        return (n) =&gt; parts.some((part) =&gt; {
          if (!part.includes(&quot;-&quot;)) return n === Number(part);
          const [from, to] = part.split(&quot;-&quot;);
          return n &gt;= Number(from) &amp;&amp; (to === &quot;&quot; || n &lt;= Number(to));
        });
      };
      const shown = Array.from(deck.querySelectorAll(&quot;[data-on]&quot;)).map((el) =&gt; ({ el, test: matcher(el.dataset.on) }));

      let current = 0;
      let swapTimer;

      const setText = () =&gt; {
        title.textContent = stages[current].title;
        line.textContent = stages[current].line;
        document.title = stages[current].title;
      };

      const go = (index, syncHash = true) =&gt; {
        current = Math.max(0, Math.min(stages.length - 1, index));
        const n = current + 1;
        deck.dataset.stage = String(n);
        clearTimeout(swapTimer);
        if (deck.dataset.ready === &quot;true&quot;) {
          head.classList.add(&quot;fade&quot;);
          swapTimer = setTimeout(() =&gt; { setText(); head.classList.remove(&quot;fade&quot;); }, 180);
        } else {
          setText();
        }
        shown.forEach(({ el, test }) =&gt; el.classList.toggle(&quot;on&quot;, test(n)));
        bars.forEach((bar, i) =&gt; bar.classList.toggle(&quot;on&quot;, i &lt;= current));
        if (syncHash) history.replaceState(null, &quot;&quot;, `#${n}`);
      };

      const fromHash = () =&gt; {
        const n = Number(location.hash.slice(1));
        return Number.isInteger(n) &amp;&amp; n &gt;= 1 &amp;&amp; n &lt;= stages.length ? n - 1 : 0;
      };

      const scale = () =&gt; {
        const s = Math.min(innerWidth / 1920, innerHeight / 1080);
        deck.style.transform = `translate(-50%, -50%) scale(${s})`;
      };

      addEventListener(&quot;resize&quot;, scale);
      addEventListener(&quot;hashchange&quot;, () =&gt; go(fromHash(), false));
      addEventListener(&quot;click&quot;, (event) =&gt; go(current + (event.shiftKey ? -1 : 1)));
      addEventListener(&quot;keydown&quot;, (event) =&gt; {
        const forward = [&quot;ArrowRight&quot;, &quot;ArrowDown&quot;, &quot; &quot;, &quot;PageDown&quot;, &quot;Enter&quot;];
        const back = [&quot;ArrowLeft&quot;, &quot;ArrowUp&quot;, &quot;PageUp&quot;, &quot;Backspace&quot;];
        if (forward.includes(event.key)) go(current + 1);
        else if (back.includes(event.key)) go(current - 1);
        else if (event.key === &quot;Home&quot;) go(0);
        else if (event.key === &quot;End&quot;) go(stages.length - 1);
        else return;
        event.preventDefault();
      });

      scale();
      go(fromHash(), false);
      requestAnimationFrame(() =&gt; requestAnimationFrame(() =&gt; { deck.dataset.ready = &quot;true&quot;; }));
    })();
  &lt;/script&gt;

&lt;script&gt;
(() =&gt; {
  const ID = &quot;memory&quot;;
  // An embedded deck has no URL of its own; the master deck keeps the position in its URL instead.
  history.replaceState = () =&gt; {};
  const deck = document.getElementById(&quot;deck&quot;);
  const count = () =&gt; deck.querySelector(&quot;.progress&quot;).children.length;
  const stage = () =&gt; Number(deck.dataset.stage);
  const send = (msg) =&gt; parent.postMessage(Object.assign({ masterDeck: ID }, msg), &quot;*&quot;);
  const forward = [&quot;ArrowRight&quot;, &quot;ArrowDown&quot;, &quot; &quot;, &quot;PageDown&quot;, &quot;Enter&quot;];
  const back = [&quot;ArrowLeft&quot;, &quot;ArrowUp&quot;, &quot;PageUp&quot;, &quot;Backspace&quot;];

  const handOff = (event, nav) =&gt; {
    event.stopImmediatePropagation();
    event.preventDefault();
    send({ nav });
  };

  addEventListener(&quot;keydown&quot;, (event) =&gt; {
    if (event.masterCommand) return;
    if (event.key === &quot;Home&quot;) return handOff(event, &quot;first&quot;);
    if (event.key === &quot;End&quot;) return handOff(event, &quot;last&quot;);
    if (forward.includes(event.key) &amp;&amp; stage() &gt;= count()) return handOff(event, &quot;next&quot;);
    if (back.includes(event.key) &amp;&amp; stage() &lt;= 1) return handOff(event, &quot;prev&quot;);
  }, true);

  addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.target.closest?.(&quot;a&quot;)) return;
    if (event.shiftKey &amp;&amp; stage() &lt;= 1) return handOff(event, &quot;prev&quot;);
    if (!event.shiftKey &amp;&amp; stage() &gt;= count()) return handOff(event, &quot;next&quot;);
  }, true);

  const press = (key, masterCommand) =&gt; {
    const event = new KeyboardEvent(&quot;keydown&quot;, { key, bubbles: true, cancelable: true });
    if (masterCommand) event.masterCommand = true;
    document.body.dispatchEvent(event);
  };

  addEventListener(&quot;message&quot;, ({ data }) =&gt; {
    if (!data || data.masterCommand === undefined) return;
    const cmd = data.masterCommand;
    if (cmd === &quot;key&quot;) press(data.key, false);
    else if (cmd === &quot;last&quot;) press(&quot;End&quot;, true);
    else if (cmd === &quot;goto&quot;) {
      press(&quot;Home&quot;, true);
      for (let i = 1; i &lt; data.stage; i += 1) press(&quot;ArrowDown&quot;, true);
    }
  });

  new MutationObserver(() =&gt; send({ stage: stage(), count: count() }))
    .observe(deck, { attributes: true, attributeFilter: [&quot;data-stage&quot;] });
  send({ ready: true, stage: stage(), count: count() });
})();
&lt;/script&gt;

  <script>
    (() => {
      const decks = [{"slug": "intro", "title": "Agent loop and token economics"}, {"slug": "prewalk", "title": "Prewalk"}, {"slug": "compaction", "title": "Long sessions and compaction"}, {"slug": "output", "title": "Output compaction"}, {"slug": "markitdown", "title": "Reading documents (MarkItDown)"}, {"slug": "memory", "title": "Codebase memory"}];
      const frames = decks.map((d) => document.getElementById(`deck-${d.slug}`));
      const ready = decks.map(() => false);
      const pending = decks.map(() => null);
      let active = -1;

      const command = (i, msg) => {
        if (ready[i]) frames[i].contentWindow.postMessage(msg, "*");
        else pending[i] = msg;
      };

      const show = (i, msg) => {
        i = Math.max(0, Math.min(decks.length - 1, i));
        if (i !== active) {
          frames.forEach((f, k) => f.classList.toggle("active", k === i));
          active = i;
        }
        command(i, msg);
        frames[i].focus();
      };

      const fromHash = () => {
        const m = /^#([a-z]+)(?:-(\d+))?$/.exec(location.hash);
        const i = m ? decks.findIndex((d) => d.slug === m[1]) : -1;
        return i < 0 ? [0, 1] : [i, Number(m[2] || 1)];
      };

      addEventListener("message", ({ source, data }) => {
        const i = frames.findIndex((f) => f.contentWindow === source);
        if (i < 0 || !data || data.masterDeck === undefined) return;
        if (data.ready) {
          ready[i] = true;
          if (pending[i]) { command(i, pending[i]); pending[i] = null; }
        }
        if (i === active && data.stage) {
          history.replaceState(null, "", `#${decks[i].slug}-${data.stage}`);
          document.title = `${decks[i].title} · ${data.stage}/${data.count}`;
        }
        if (data.nav === "next" && i < decks.length - 1) show(i + 1, { masterCommand: "goto", stage: 1 });
        else if (data.nav === "prev" && i > 0) show(i - 1, { masterCommand: "last" });
        else if (data.nav === "first") show(0, { masterCommand: "goto", stage: 1 });
        else if (data.nav === "last") show(decks.length - 1, { masterCommand: "last" });
      });

      // Keys that reach this page instead of a deck (before a deck has focus) go to the active deck.
      addEventListener("keydown", (event) => {
        command(active, { masterCommand: "key", key: event.key });
        frames[active].focus();
        event.preventDefault();
      });

      addEventListener("hashchange", () => {
        const [i, stage] = fromHash();
        show(i, { masterCommand: "goto", stage });
      });

      const [i, stage] = fromHash();
      show(i, { masterCommand: "goto", stage });
    })();
  </script>
